services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/investory
      DB_USERNAME: investory
      DB_PASSWORD: investory
    volumes:
      - maven-cache:/home/vscode/.m2
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: investory
      POSTGRES_USER: investory
      POSTGRES_PASSWORD: investory
    ports:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investory -d investory"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  maven-cache:
  postgres-data:
