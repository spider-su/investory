services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        DOCKER_GID: "${DOCKER_GID:-999}"
    command: >
      bash -lc "
        sudo mkdir -p /home/vscode/.m2/repository &&
        sudo chown -R vscode:vscode /home/vscode/.m2 &&
        exec sleep infinity
      "
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/investory
      DB_USERNAME: investory
      DB_PASSWORD: investory
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_API_VERSION: "1.40"
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    volumes:
      - "${INVESTORY_WORKSPACE:-..}:/workspaces/investory"
      - maven-cache:/home/vscode/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: investory
      POSTGRES_USER: investory
      POSTGRES_PASSWORD: investory
    ports:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investory -d investory"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  maven-cache:
  postgres-data:
