name: Python RAG

on:
  pull_request:
    paths:
      - 'services/rag/**'
      - '.github/workflows/rag-python.yml'
  push:
    branches: [develop, main]
    paths:
      - 'services/rag/**'
      - '.github/workflows/rag-python.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/rag/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test without OpenAI credentials
        run: python -m pytest -q
