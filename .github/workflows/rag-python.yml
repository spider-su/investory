name: Python RAG
on:
  pull_request:
    paths:
      - 'services/rag/**'
      - '.github/workflows/rag-python.yml'
  push:
    branches: [develop, main]
    paths:
      - 'services/rag/**'
      - '.github/workflows/rag-python.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/rag/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Test without OpenAI credentials
        run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RAG image
        run: docker build -f services/rag/Dockerfile -t investory-rag:ci .
      - name: Verify bundled local model without network or provider key
        run: |
          docker run --rm --network none --entrypoint python investory-rag:ci -c \
            "from investory_rag.config import Settings; from investory_rag.embeddings import build_embeddings; v=build_embeddings(Settings(embedding_provider='local')).embed_query('offline model verification'); assert len(v)==384"
      - name: Verify health and fail-closed API
        run: |
          docker run -d --name rag-ci -p 127.0.0.1:18090:8090 investory-rag:ci
          trap 'docker logs rag-ci; docker rm -f rag-ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18090/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18090/health
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18090/ask \
            -H 'Content-Type: application/json' -d '{"question":"hello"}')
          test "$code" = "503"
      - name: Scan RAG runtime image before merge
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: investory-rag:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
