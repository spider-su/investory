name: Temporary Orchestrator Source Format
on:
  push:
    branches:
      - feat/unified-financial-ai-orchestrator
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-maven
      - name: Format sources and expose reproducible output
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" spotless:apply
          for p in app/src/main/java/com/smartbox/investory/rag/FinancialAiOrchestratorController.java app/src/test/java/com/smartbox/investory/rag/FinancialAiOrchestratorControllerTest.java app/src/main/java/com/smartbox/investory/config/SecurityConfig.java app/src/main/java/com/smartbox/investory/config/PortfolioOwnershipInterceptor.java app/src/test/java/com/smartbox/investory/config/SecurityConfigTest.java app/src/test/java/com/smartbox/investory/config/PortfolioOwnershipInterceptorTest.java app/src/test/java/com/smartbox/investory/app/SmartAssistantTemplateContractTest.java; do
            echo "BEGIN_FORMATTED:$p"
            cat "$p"
            echo "END_FORMATTED:$p"
          done
