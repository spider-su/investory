name: Nightly release preflight

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Required safe preflight; production actions are not enabled.
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch release branches
        run: git fetch origin main develop
      - name: Compare branch revisions
        id: refs
        run: |
          {
            echo "main=$(git rev-parse origin/main)"
            echo "develop=$(git rev-parse origin/develop)"
            echo "unreleased=$(git rev-list --count origin/main..origin/develop)"
          } >> "$GITHUB_OUTPUT"
      - name: Skip when unchanged
        if: steps.refs.outputs.unreleased == '0'
        run: echo "No new changes on develop; no release needed."
      - name: Read exact develop SHA checks
        if: steps.refs.outputs.unreleased != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.refs.outputs.develop }}
          MAIN_SHA: ${{ steps.refs.outputs.main }}
          UNRELEASED_COMMITS: ${{ steps.refs.outputs.unreleased }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --branch develop --commit "$CANDIDATE_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            echo "No push CI run for the exact develop revision." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > run.json
          ATTEMPT=$(python3 -c 'import json; print(json.load(open("run.json"))["run_attempt"])')
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs?per_page=100" > jobs.json
          python3 - <<'PYINPUT' > preflight.json
          import json, os
          run = json.load(open("run.json"))
          jobs = [job for page in json.load(open("jobs.json")) for job in page["jobs"]]
          checks = [{"head_sha": run["head_sha"], "name": job["name"], "conclusion": job["conclusion"]} for job in jobs]
          checks.append({"head_sha": run["head_sha"], "name": "workflow_run", "conclusion": run["conclusion"] if run["status"] == "completed" else None})
          print(json.dumps({"develop_sha": os.environ["CANDIDATE_SHA"], "main_sha": os.environ["MAIN_SHA"], "unreleased_commits": int(os.environ["UNRELEASED_COMMITS"]), "checks": checks}))
          PYINPUT
          python3 .github/scripts/nightly_release_preflight.py < preflight.json
      - name: Report gated status
        if: always()
        run: |
          echo "Nightly release is preflight-only. No promotion, image publication, or production deployment was attempted." >> "$GITHUB_STEP_SUMMARY"
