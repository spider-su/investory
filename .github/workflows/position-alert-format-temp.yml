name: Temporary position alert formatting export
on:
  pull_request:
    paths:
      - '.github/workflows/position-alert-format-temp.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply format and print file content
        run: |
          chmod +x mvnw
          ./mvnw -pl integrations spotless:apply --batch-mode --no-transfer-progress
          for file in \
            integrations/src/main/java/com/smartbox/investory/integrations/notifications/application/PositionPriceAlertService.java \
            integrations/src/main/java/com/smartbox/investory/integrations/notifications/web/PositionPriceAlertController.java; do
            echo "FORMATTED_BEGIN:$file"
            base64 "$file" | fold -w 76
            echo "FORMATTED_END:$file"
          done
