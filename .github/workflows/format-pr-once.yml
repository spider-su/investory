name: Format PR once

on:
  push:
    branches:
      - fix/db-reference-constraints

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/db-reference-constraints

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply Spotless
        run: mvn --batch-mode --no-transfer-progress spotless:apply

      - name: Commit formatted tests
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/java/com/trading/investory/database/*.java
          git commit -m "style(test): apply Spotless formatting"
          git push origin HEAD:fix/db-reference-constraints
