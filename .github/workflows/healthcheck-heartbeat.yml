name: Healthcheck heartbeat

on:
  schedule:
    - cron: '45-59/5 7 * * *'
      timezone: 'Europe/Warsaw'
    - cron: '*/5 8-21 * * *'
      timezone: 'Europe/Warsaw'
    - cron: '0-15/5 22 * * *'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:

permissions: {}

jobs:
  healthcheck:
    name: Keep service warm
    runs-on: ubuntu-latest

    steps:
      - name: Call health endpoint
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 2 \
            --max-time 20 \
            "$HEALTHCHECK_URL"
          echo "Healthcheck succeeded."
