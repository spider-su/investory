name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: sh ./mvnw --batch-mode --no-transfer-progress "-Duser.home=$RUNNER_TEMP" "-Dmaven.repo.local=$RUNNER_TEMP/m2" test

  it:
    name: IT
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Playwright Chromium
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress "-Duser.home=$RUNNER_TEMP" "-Dmaven.repo.local=$RUNNER_TEMP/m2" -pl app -am -DskipTests install
          sh ./mvnw --batch-mode --no-transfer-progress "-Duser.home=$RUNNER_TEMP" "-Dmaven.repo.local=$RUNNER_TEMP/m2" -pl app exec:java -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run integration tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress "-Duser.home=$RUNNER_TEMP" "-Dmaven.repo.local=$RUNNER_TEMP/m2" -pl app -am -DskipTests install
          sh ./mvnw --batch-mode --no-transfer-progress "-Duser.home=$RUNNER_TEMP" "-Dmaven.repo.local=$RUNNER_TEMP/m2" -pl app test-compile failsafe:integration-test failsafe:verify \
            "-Dit.test=ValuationInputContractIT,SystemAuditContractIT,MaterializedViewRefreshContractIT,DatabaseReportingContractIT,BaselineReadinessContractIT,AccountMonthlyBenchmarkContractIT,CurrencyRateUpdaterPostgresIT,SchemaMigrationCheckpoint2IT,IbkrTreasuryImportIT,XtbImportIT,UiPageSmokeIT,LongTermAssetCrudUiIT"

  goldenPath:
    name: Golden path
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run offline golden gate
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress "-Duser.home=$RUNNER_TEMP" "-Dmaven.repo.local=$RUNNER_TEMP/m2" -pl app -am -DskipTests install
          sh ./mvnw --batch-mode --no-transfer-progress "-Duser.home=$RUNNER_TEMP" "-Dmaven.repo.local=$RUNNER_TEMP/m2" -pl app \
            "-Dmaven.compiler.useIncrementalCompilation=false" \
            "-Dtest=GoldenRebuildIT" test

      - name: Check formatting
        run: sh ./mvnw --batch-mode --no-transfer-progress "-Duser.home=$RUNNER_TEMP" "-Dmaven.repo.local=$RUNNER_TEMP/m2" spotless:check
