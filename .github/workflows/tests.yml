name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_USER_HOME: ${{ github.workspace }}/.m2

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check local Markdown links
        run: python3 tools/check_markdown_links.py

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Maven cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" -DskipITs verify

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-module-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: error

      - name: Upload unit execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit-exec
          path: '**/target/jacoco.exec'
          if-no-files-found: error

  backendIt:
    name: Backend IT (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: contracts
            project: app
            tests: ValuationInputContractIT,SystemAuditContractIT,MaterializedViewRefreshContractIT,DatabaseReportingContractIT,BaselineReadinessContractIT,AccountMonthlyBenchmarkContractIT
          - name: imports
            project: app
            tests: CurrencyRateUpdaterPostgresIT,IbkrTreasuryImportIT,XtbImportIT
          - name: schema
            project: app
            tests: SchemaMigrationCheckpoint2IT
          - name: reconciliation-notifications-longterm
            project: app
            tests: DatabaseEvidenceReconciliationCheckIT,RentalContractPersistenceIT,NotificationEventContractIT
          - name: investment-rest
            project: modules/investment
            tests: DailyPerformanceControllerIT,InvestmentAssetRestControllerIT,InvestmentDashboardRestControllerIT,InvestmentPerformanceControllerIT,InvestmentReconciliationRestControllerIT
          - name: retirement-rest
            project: modules/retirement
            tests: RetirementAnalysisRestControllerIT,RetirementPlanRestControllerIT,RetirementPreviewRestControllerIT,RetirementProfileRestControllerIT,RetirementProjectionRestControllerIT

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Maven cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run backend integration tests
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" -pl "${{ matrix.suite.project }}" -am -DskipTests install
          sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" -pl "${{ matrix.suite.project }}" test-compile failsafe:integration-test failsafe:verify \
            "-Dit.test=${{ matrix.suite.tests }}"

      - name: Upload backend integration execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend-${{ matrix.suite.name }}
          path: '**/target/jacoco.exec'
          if-no-files-found: error

  uiIt:
    name: UI IT (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: smoke
            test: UiPageSmokeIT
          - name: long-term-assets
            test: LongTermAssetCrudUiIT
          - name: simulation
            test: PlanSimulationCrudUiIT
          - name: investment-dashboard
            test: InvestmentDashboardGoldenUiIT

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Maven cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" -pl app -am -DskipTests install
          sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" -pl app exec:java -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run UI integration tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" -pl app -am -DskipTests install
          sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" -pl app test-compile failsafe:integration-test failsafe:verify \
            "-Dit.test=${{ matrix.suite.test }}"

      - name: Upload UI integration execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-ui-${{ matrix.suite.name }}
          path: '**/target/jacoco.exec'
          if-no-files-found: error

  goldenPath:
    name: Golden path
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Maven cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run offline golden gate
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" -pl app -am -DskipTests install
          sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" -pl app \
            "-Dmaven.compiler.useIncrementalCompilation=false" \
            "-Dtest=GoldenRebuildIT" test

      - name: Check formatting
        run: sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" spotless:check

      - name: Upload golden-path execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-golden-path
          path: '**/target/jacoco.exec'
          if-no-files-found: error

  aggregateCoverage:
    name: Aggregate coverage gate
    needs: [unit, backendIt, uiIt, goldenPath]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Maven cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download execution data
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          path: coverage-input
          merge-multiple: false

      - name: Consolidate execution data
        run: |
          mkdir -p app/target/coverage-data
          find coverage-input -name jacoco.exec -print0 | while IFS= read -r -d '' file; do
            name=$(printf '%s' "$file" | sha256sum | cut -d' ' -f1)
            cp "$file" "app/target/coverage-data/$name.exec"
          done

      - name: Build aggregate report and enforce baseline
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress "-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository" -pl app -am -DskipTests verify
          python3 check_aggregate_coverage.py

      - name: Upload aggregate coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-aggregate-report
          path: app/target/site/jacoco-aggregate/
          if-no-files-found: error
