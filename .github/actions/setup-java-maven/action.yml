name: Set up Java and Maven
description: Install the project JDK and restore the shared Maven dependency cache
inputs:
  java-version:
    description: Java version
    required: false
    default: '25'
runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Configure Maven retry handling
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.m2"
        cat > "$GITHUB_WORKSPACE/.m2/maven.config" <<'EOF'
        -Dmaven.wagon.http.retryHandler.count=5
        -Dmaven.wagon.http.retryHandler.requestSentEnabled=true
        -Dmaven.artifact.threads=1
        EOF

    - name: Restore Maven cache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-maven-
