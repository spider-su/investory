<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/theme-head :: theme}"></th:block><meta charset="UTF-8"><title th:text="${asset.name + ' · Investory'}">Bond · Investory</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="/css/tabler.min.css" rel="stylesheet"><link href="/css/main.css" rel="stylesheet"></head>
<body><main class="container-xl py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 th:text="${asset.name}">Bond</h1><p class="text-secondary">Manual planning bond. Advanced rate history remains stored but is managed automatically here.</p></div><a class="btn btn-link" th:href="@{/long-term-assets(portfolioId=${portfolioId})}">Back</a></div>
<form class="card mb-4" method="post" th:action="@{/long-term-assets/{id}/bond(id=${asset.id})}"><div class="card-body"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" th:value="${asset.name}" required></div><div class="col-md-3"><label class="form-label">Currency</label><select class="form-select" name="currency"><option th:each="currency : ${T(com.smartbox.investory.infrastructure.CurrencyType).values()}" th:value="${currency}" th:text="${currency}" th:selected="${currency == asset.currency}"></option></select></div><div class="col-md-3"><label class="form-label">Value</label><input class="form-control" name="value" type="number" step="0.01" min="0" th:value="${summary.bondPlanning.value}" required><div class="form-hint" th:if="${legacyBondValueDifference}">Legacy invested value is preserved.</div></div><div class="col-md-3"><label class="form-label">Purchase date</label><input class="form-control" name="acquisitionDate" type="date" th:value="${asset.acquisitionDate}" required></div><div class="col-md-3"><label class="form-label">Maturity date</label><input class="form-control" name="maturityDate" type="date" th:value="${summary.bondPlanning.maturityDate}" required></div><div class="col-md-3"><label class="form-label">Interest mode</label><select class="form-select" name="interestTreatment"><option value="CAPITALIZE" th:selected="${summary.bondPlanning.interestTreatment != null and summary.bondPlanning.interestTreatment.name() == 'CAPITALIZE'}">Accumulative</option><option value="PAY_OUT" th:selected="${summary.bondPlanning.interestTreatment != null and summary.bondPlanning.interestTreatment.name() == 'PAY_OUT'}">Distributed</option></select></div><div class="col-md-3"><label class="form-label">Expected annual rate</label><div class="input-group"><input class="form-control" name="annualRatePercent" type="number" step="0.01" min="0" max="100" th:value="${summary.bondPlanning.annualRate * 100}" required><span class="input-group-text">%</span></div></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3" th:text="${asset.notes}"></textarea></div></div><div class="alert alert-secondary mt-3 mb-0" th:if="${legacyBondValueDifference}">Legacy bond value history exists. Invested value is retained internally; new normal bonds use one value.</div></div><div class="card-footer"><button class="btn btn-primary">Save changes</button></div></form><form method="post" th:action="@{/long-term-assets/{id}/archive(id=${asset.id})}"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><button class="btn btn-outline-danger">Archive</button></form></main></body></html>
