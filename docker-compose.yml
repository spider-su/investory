services:
  investory:
    image: "aserobaba/investory:${INVESTORY_IMAGE_TAG:?Set INVESTORY_IMAGE_TAG to an immutable image tag}"
    container_name: investory-app
    restart: unless-stopped
    profiles:
      - prod
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DEVELOP_MODE: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
