[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "investory-rag"
version = "0.1.0"
description = "Read-only document RAG service for Investory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langchain-chroma>=0.2,<2",
  "langchain-text-splitters>=0.3,<2",
  "chromadb>=0.6,<2",
  "fastembed==0.9.1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
acceptance = ["mcp>=1.30,<2", "httpx>=0.27,<1"]
[project.scripts]
investory-rag-index = "investory_rag.cli:main"
investory-rag-eval = "investory_rag.eval_cli:main"
investory-ai-smoke = "investory_rag.acceptance_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
