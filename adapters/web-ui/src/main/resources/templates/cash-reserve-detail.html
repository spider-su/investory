<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/theme-head :: theme}"></th:block>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${asset.name + ' · Investory'}">Cash reserve · Investory</title>
  <link href="/css/tabler.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/asset-detail.css" rel="stylesheet">
</head>
<body>
<main class="container-xl py-4">
  <header class="iv-asset-page__header">
    <div>
      <div class="iv-asset-page__eyebrow">Cash reserve</div>
      <h1 class="h2 mb-0" th:text="${asset.name}">Cash reserve</h1>
      <p class="iv-asset-page__description">Immediately spendable planning reserve. It does not create brokerage accounting activity.</p>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/long-term-assets(portfolioId=${portfolioId})}">Back</a>
  </header>

  <div class="alert alert-danger" th:if="${error}" th:text="${error}">Validation error.</div>

  <form class="card mb-4" method="post" th:action="@{/long-term-assets/cash-reserve}">
    <div class="card-header"><h2 class="card-title">Reserve details</h2></div>
    <div class="card-body">
      <input type="hidden" name="portfolioId" th:value="${portfolioId}">
      <input type="hidden" name="id" th:value="${asset.id}">
      <div class="row g-3">
        <div class="col-lg-6"><label class="form-label" for="reserve-name">Name</label><input id="reserve-name" class="form-control" name="name" th:value="${asset.name}" required></div>
        <div class="col-sm-6 col-lg-3"><label class="form-label" for="reserve-currency">Currency</label><input type="hidden" name="currency" th:value="${asset.currency}"><input id="reserve-currency" class="form-control" th:value="${asset.currency}" readonly aria-readonly="true"></div>
        <div class="col-sm-6 col-lg-3"><label class="form-label" for="reserve-value">Current value</label><input id="reserve-value" class="form-control" name="value" type="number" step="0.01" min="0" th:value="${T(com.smartbox.investory.ui.presentation.UiPresentation).moneyInput(asset.currentValue)}" required></div>
        <div class="col-sm-6 col-lg-3"><label class="form-label" for="reserve-return">Optional annual return</label><div class="input-group"><input id="reserve-return" class="form-control" name="annualReturnPercent" type="number" step="0.01" min="0" max="100" th:value="${T(com.smartbox.investory.ui.presentation.UiPresentation).percentageInput(summary.currentAnnualRate)}"><span class="input-group-text">%</span></div></div>
        <div class="col-12"><label class="form-label" for="reserve-notes">Notes</label><textarea id="reserve-notes" class="form-control" name="notes" rows="4" th:text="${asset.notes}"></textarea></div>
      </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary">Save changes</button></div>
  </form>

  <div class="iv-asset-page__actions">
    <form method="post" th:action="@{/long-term-assets/{id}/archive(id=${asset.id})}"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><button class="btn btn-outline-danger" th:if="${asset.active}">Archive</button></form>
    <form method="post" th:action="@{/long-term-assets/{id}/reactivate(id=${asset.id})}"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><button class="btn btn-outline-success" th:unless="${asset.active}">Reactivate</button></form>
  </div>
</main>
</body>
</html>
