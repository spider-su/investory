<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/theme-head :: theme}"></th:block><meta charset="UTF-8"><title>Real estate · Investory</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="/css/tabler.min.css" rel="stylesheet"></head><body><main class="container-xl py-4"><h1>Rental property</h1><p class="text-secondary">This form creates a real-estate asset and its initial rental contract.</p><form class="card" method="post" th:action="@{/portfolios/{portfolioId}/long-term-assets/real-estate(portfolioId=${portfolioId})}" action="/long-term-assets/real-estate"><div class="card-body"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required></div><div class="col-md-3"><label class="form-label">Currency</label><select class="form-select" name="currency"><option th:each="currency : ${T(com.smartbox.investory.shared.currency.CurrencyType).values()}" th:value="${currency}" th:text="${currency}"></option></select></div><div class="col-md-3"><label class="form-label">Current value</label><input class="form-control" name="currentValue" type="number" step="0.01" min="0" required></div><div class="col-md-3"><label class="form-label">Tax base</label><input class="form-control" name="taxBase" type="number" step="0.01" min="0"></div><div class="col-md-3"><label class="form-label">Acquisition date</label><input class="form-control" name="acquisitionDate" type="date"></div><div class="col-md-3"><label class="form-label">Acquisition value</label><input class="form-control" name="acquisitionValue" type="number" step="0.01" min="0"></div><div class="col-md-3"><label class="form-label">Contract starts</label><input class="form-control" name="effectiveFrom" type="date" required></div><div class="col-md-3"><label class="form-label">Monthly rent</label><input class="form-control" name="monthlyRent" type="number" step="0.01" min="0"></div><div class="col-md-3"><label class="form-label">Monthly parking income</label><input class="form-control" name="monthlyParkingIncome" type="number" step="0.01" min="0"></div><div class="col-md-3"><label class="form-label">Monthly administration cost</label><input class="form-control" name="monthlyAdministrationCost" type="number" step="0.01" min="0"></div><div class="col-md-3"><label class="form-label">Other monthly cost</label><input class="form-control" name="monthlyOtherCost" type="number" step="0.01" min="0"></div><div class="col-md-3"><label class="form-label">Annual property tax</label><input class="form-control" name="annualPropertyTax" type="number" step="0.01" min="0"></div><div class="col-md-3"><label class="form-label">Annual insurance</label><input class="form-control" name="annualInsurance" type="number" step="0.01" min="0"></div><div class="col-md-3"><label class="form-label">Expected growth (informational)</label><input class="form-control" name="expectedAnnualGrowthRatePercent" type="number" step="0.01" min="-100" max="100"></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3"></textarea></div></div></div><div class="card-footer"><button class="btn btn-primary">Save property</button> <a class="btn btn-link" th:href="@{/portfolios/{portfolioId}/long-term-assets(portfolioId=${portfolioId})}">Cancel</a></div></form></main></body></html>
