<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/theme-head :: theme}"></th:block><meta charset="UTF-8"><title>Real estate · Investory</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="/css/tabler.min.css" rel="stylesheet"><link href="/css/planning.css" rel="stylesheet"></head>
<body><main class="iv-app iv-planning-page iv-long-term-form-page">
  <div th:replace="~{fragments/long-term-form-header :: header('Add real estate', 'Property identity and value. Rental contracts are managed after creation.', ${portfolioId})}"></div>
  <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}">Validation error.</div>
  <form class="card iv-long-term-form" method="post" th:action="@{/portfolios/{portfolioId}/long-term-assets/real-estate(portfolioId=${portfolioId})}">
    <div class="iv-card-section-header"><span class="iv-card-section-header__title">Property details</span></div>
    <div class="card-body iv-long-term-form__body"><div class="row g-3">
      <div class="col-md-6"><label class="form-label" for="property-create-name">Name</label><input id="property-create-name" class="form-control" name="name" th:value="${asset?.name}" required></div>
      <div class="col-md-3"><label class="form-label" for="property-create-currency">Currency</label><select id="property-create-currency" class="form-select" name="currency" required><option th:each="currency : ${T(com.smartbox.investory.shared.currency.CurrencyType).values()}" th:value="${currency}" th:text="${currency}" th:selected="${currency == asset?.currency}"></option></select></div>
      <div class="col-md-3"><label class="form-label" for="property-create-value">Current value</label><input id="property-create-value" class="form-control" name="value" type="number" step="0.01" min="0" th:value="${asset?.value == null ? '' : T(com.smartbox.investory.ui.presentation.UiPresentation).moneyInput(asset.value)}" required></div>
      <div class="col-md-4"><label class="form-label" for="property-create-date">Acquisition date</label><input id="property-create-date" class="form-control" name="acquisitionDate" type="date" th:value="${asset?.acquisitionDate}"></div>
      <div class="col-md-4"><label class="form-label" for="property-create-register">Land register number</label><input id="property-create-register" class="form-control" name="landRegisterNumber" th:value="${asset?.landRegisterNumber}"></div>
      <div class="col-md-4"><label class="form-label" for="property-create-tax-base">Annual rental tax base</label><input id="property-create-tax-base" class="form-control" name="taxBase" type="number" step="0.01" min="0" th:value="${asset?.taxBase == null ? '' : T(com.smartbox.investory.ui.presentation.UiPresentation).moneyInput(asset.taxBase)}"></div>
      <div class="col-12"><label class="form-label" for="property-create-notes">Notes</label><textarea id="property-create-notes" class="form-control" name="notes" rows="3" th:text="${asset?.notes}"></textarea></div>
    </div></div>
    <div class="card-footer iv-long-term-form__actions"><button class="btn btn-primary">Save property</button><a class="btn btn-link" th:href="@{/portfolios/{portfolioId}/long-term-assets(portfolioId=${portfolioId})}">Cancel</a></div>
  </form>
</main><div th:replace="~{fragments/app-footer :: buildFooter}"></div></body></html>
