<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Investory — Portfolio Intelligence</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/css/tabler.min.css" rel="stylesheet">
    <th:block th:replace="~{fragments/theme-head :: theme}"></th:block>
  <link href="/css/dashboard.css" rel="stylesheet" data-turbo-track="reload">
</head>

<body>
<th:block th:with="stats=${dashboard.overview}, benchmark=${dashboard.performance.benchmark}, topGainers=${dashboard.performance.topGainers}, topLosers=${dashboard.performance.topLosers}">
<div class="iv-app">
    <!-- Topbar -->
  <div th:replace="~{dashboard/fragments/dashboard-header :: dashboardHeader}"></div>
    <!-- KPI tiles -->
  <div th:replace="~{dashboard/fragments/overview :: overview}"></div>

  <div th:replace="~{dashboard/fragments/modals :: modals}"></div>

  <div th:replace="~{dashboard/fragments/performance :: performance}"></div>
  <div th:replace="~{dashboard/fragments/portfolio-structure :: portfolioStructure}"></div>

    <div th:replace="~{fragments/app-footer :: buildFooter}"></div>
</div> <!-- .iv-app -->

<!-- Scripts -->
<!--suppress JSUnresolvedLibraryURL -->
<script id="dashboard-page-data" type="application/json" th:inline="javascript">
    {
        "monthlyPerformance": /*[[${stats.monthlyPerformance.calculateMonthlyPerformance}]]*/ {},
        "monthlyOperationsCount": /*[[${stats.monthlyPerformance.monthlyOperationsCount}]]*/ {},
        "monthlyCashflow": /*[[${stats.monthlyPerformance.monthlyCashflow}]]*/ {},
        "monthlyAttributions": /*[[${stats.monthlyPerformance.monthlyAttributions}]]*/ {},
        "baseCurrency": /*[[${stats.baseCurrency}]]*/ "USD",
        "portfolioId": /*[[${portfolioId}]]*/ null,
        "benchmarkLabels": /*[[${benchmark != null ? benchmark.labels : null}]]*/ [],
        "benchmarkAccountSeries": /*[[${benchmark != null ? benchmark.accountSeries : null}]]*/ [],
        "benchmarkReturnCurve": /*[[${benchmark != null ? benchmark.benchmarkReturnCurve : null}]]*/ [],
        "selectedDashboardPeriod": /*[[${selectedPeriod.urlValue()}]]*/ "YTD",
        "accountValueYears": /*[[${benchmark != null ? benchmark.accountValueYears : null}]]*/ []
    }
</script>
</th:block>

</body>
</html>
