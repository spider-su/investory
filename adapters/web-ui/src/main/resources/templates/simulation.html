<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retirement simulation · Investory</title>
  <link href="/css/tabler.min.css" rel="stylesheet">
  <th:block th:replace="~{fragments/theme-head :: theme}"></th:block>
  <link href="/css/planning.css" rel="stylesheet" data-turbo-track="reload">
</head>
<body>
<main class="iv-app iv-planning-page iv-simulation-page iv-retirement-surface">
  <div th:replace="~{fragments/app-header :: planningHeader('simulation', ${simulationPage.profile.portfolioId}, 'Retirement simulation', 'Plan status', ${simulationPage.outlook.failed ? 'Plan fails' : 'Sustainable'}, ${simulationPage.selectedScenario.name().substring(0, 1) + simulationPage.selectedScenario.name().substring(1).toLowerCase()}, 'Planning horizon', ${simulationPage.forwardAssumptions.currentAge + '–' + simulationPage.forwardAssumptions.endAge}, 'age range', 'Minimum liquid assets', ${simulationPage.outlook.minimumLiquidAssetsDisplay}, ${simulationPage.outlook.minimumLiquidAssetsContext}, ${simulationPage.displayCurrency}, 'simulation', ${simulationPage.selectedPlanId}, ${simulationPage.selectedScenario})}"></div>
  <div th:replace="~{simulation/fragments/timeline :: timeline}"></div>
  <div th:replace="~{simulation/fragments/charts :: charts}"></div>
  <div th:replace="~{simulation/fragments/projection :: projection}"></div>
</main>
<div th:replace="~{fragments/app-footer :: buildFooter}"></div>
<script id="simulation-page-data" type="application/json" th:inline="javascript">{
    "chartData": /*[[${simulationPage.chartData}]]*/ {"points": [], "retirementYear": null, "pensionStartYear": null},
    "currency": /*[[${simulationPage.displayCurrency.name()}]]*/ "PLN"
}</script>
</body>
</html>
