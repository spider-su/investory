<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title th:text="${symbol + ' · Market Radar'}">Market Radar</title><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/css/tabler.min.css" rel="stylesheet"><th:block th:replace="~{fragments/theme-head :: theme}"></th:block>
</head>
<body><main class="container-xl py-4">
  <a class="btn btn-link px-0 mb-2" href="/market-radar">← Back to Market Radar</a>
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
    <div><div class="page-pretitle">Signal history</div><h1 class="page-title" th:text="${symbol}">AAPL</h1>
      <div class="text-secondary">Daily observations are frozen so changes can be evaluated over time.</div></div>
    <div class="text-end"><span class="badge fs-5" th:text="${current.state}">TRENDING</span><div class="text-secondary small mt-1" th:text="${current.date}">2026-10-03</div></div>
  </div>
  <div class="row row-cards mb-3">
    <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="text-secondary">Close</div><div class="h2" th:text="${#numbers.formatDecimal(current.close,1,2)}">0</div></div></div></div>
    <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="text-secondary">20d momentum</div><div class="h2" th:text="${current.return20d == null ? '—' : #numbers.formatPercent(current.return20d,1,1)}">—</div></div></div></div>
    <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="text-secondary">Relative volume</div><div class="h2" th:text="${current.relativeVolume20d == null ? '—' : #numbers.formatDecimal(current.relativeVolume20d,1,2) + '×'}">—</div></div></div></div>
    <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="text-secondary">RSI14</div><div class="h2" th:text="${current.rsi14 == null ? '—' : #numbers.formatDecimal(current.rsi14,1,1)}">—</div></div></div></div>
  </div>
  <div class="card"><div class="card-header"><h3 class="card-title">Recorded observations</h3></div><div class="table-responsive">
    <table class="table card-table table-vcenter"><thead><tr><th>Date</th><th>State</th><th>Close</th><th>20d</th><th>60d</th><th>Rel. volume</th><th>RSI</th><th>Reasons</th></tr></thead>
      <tbody><tr th:each="signal : ${history}"><td th:text="${signal.date}">date</td><td><span class="badge" th:text="${signal.state}">state</span></td>
        <td th:text="${#numbers.formatDecimal(signal.close,1,2)}">0</td><td th:text="${signal.return20d == null ? '—' : #numbers.formatPercent(signal.return20d,1,1)}">—</td>
        <td th:text="${signal.return60d == null ? '—' : #numbers.formatPercent(signal.return60d,1,1)}">—</td><td th:text="${signal.relativeVolume20d == null ? '—' : #numbers.formatDecimal(signal.relativeVolume20d,1,2) + '×'}">—</td>
        <td th:text="${signal.rsi14 == null ? '—' : #numbers.formatDecimal(signal.rsi14,1,1)}">—</td><td th:text="${#lists.isEmpty(signal.reasons) ? '—' : #strings.listJoin(signal.reasons, ' · ')}">—</td></tr></tbody>
    </table>
  </div></div>
</main><script src="/js/theme.js"></script></body></html>
