<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/theme-head :: theme}"></th:block><meta charset="UTF-8"><title>Cash reserve · Investory</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="/css/tabler.min.css" rel="stylesheet"><link href="/css/main.css" rel="stylesheet"></head><body><main class="container-xl py-4"><h1>New cash reserve</h1><p class="text-secondary">Manual planning cash. It is immediately spendable in retirement simulation and creates no brokerage accounting activity.</p><form class="card" method="post" action="/long-term-assets/cash-reserve"><div class="card-body"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required></div><div class="col-md-3"><label class="form-label">Currency</label><select class="form-select" name="currency"><option th:each="currency : ${T(com.smartbox.investory.shared.currency.CurrencyType).values()}" th:value="${currency}" th:text="${currency}"></option></select></div><div class="col-md-3"><label class="form-label">Current value</label><input class="form-control" name="value" type="number" step="0.01" min="0" required></div><div class="col-md-3"><label class="form-label">Optional annual return</label><div class="input-group"><input class="form-control" name="annualReturnPercent" type="number" step="0.01"><span class="input-group-text">%</span></div></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3"></textarea></div></div></div><div class="card-footer"><button class="btn btn-primary">Save cash reserve</button> <a class="btn btn-link" th:href="@{/long-term-assets(portfolioId=${portfolioId})}">Cancel</a></div></form></main></body></html>
