<!-- Real-estate property hero. -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="hero">
  <header class="iv-property-hero mb-4">
    <div class="iv-property-hero__title">
      <a class="iv-property-hero__back" th:href="@{/portfolios/{portfolioId}/long-term-assets(portfolioId=${portfolioId})}">← Long-Term Assets</a>
      <div class="iv-property-page__eyebrow">Rental property</div>
      <h1 class="h2 mb-0" th:text="${asset.name}">Real estate</h1>
    </div>
    <dl class="iv-property-hero__metrics">
      <div><dt>Current value</dt><dd th:text="${T(com.smartbox.investory.ui.presentation.UiPresentation).money(asset.currentValue, asset.currency)}">0 PLN</dd></div>
      <div><dt>Monthly net income</dt><dd th:text="${T(com.smartbox.investory.ui.presentation.UiPresentation).money(summary.realEstatePlanning.netMonthlyIncome, asset.currency)}">0 PLN</dd></div>
      <div><dt>Income yield</dt><dd th:text="${T(com.smartbox.investory.ui.presentation.UiPresentation).percentage(summary.realEstatePlanning.incomeYield) + ' (' + T(com.smartbox.investory.ui.presentation.UiPresentation).percentage(summary.annualEconomics.grossYield) + ')'}">0.0% (0.0%)</dd></div>
    </dl>
    <div class="iv-asset-page__actions">
      <a class="btn btn-outline-secondary" href="#property-settings">Property settings</a>
      <form method="post" th:action="@{/portfolios/{portfolioId}/long-term-assets/{id}/archive(id=${asset.id},portfolioId=${portfolioId})}"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><button class="btn btn-outline-danger" th:if="${asset.active}">Archive</button></form>
      <form method="post" th:action="@{/portfolios/{portfolioId}/long-term-assets/{id}/reactivate(id=${asset.id},portfolioId=${portfolioId})}"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><button class="btn btn-outline-success" th:unless="${asset.active}">Reactivate</button></form>
    </div>
  </header>

</th:block>
