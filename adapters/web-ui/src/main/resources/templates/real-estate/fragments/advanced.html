<!-- Real-estate advanced planning. -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="advanced">
  <details class="card mb-4 iv-property-advanced">
    <summary class="card-header iv-property-disclosure"><span class="card-title mb-0">Advanced planning</span></summary>
    <div class="card-body">
      <form class="row g-2 align-items-end" method="post" th:action="@{/long-term-assets/{id}/property-growth(id=${asset.id})}">
        <input type="hidden" name="portfolioId" th:value="${portfolioId}">
        <div class="col-md-4"><label class="form-label" for="growth-rate">Expected annual growth</label><div class="input-group"><input id="growth-rate" class="form-control" name="growthRatePercent" type="number" step="0.01" min="-100" max="100" th:value="${expectedPropertyGrowth == null ? '' : T(com.smartbox.investory.ui.presentation.UiPresentation).percentageInput(expectedPropertyGrowth)}"><span class="input-group-text">%</span></div></div>
        <div class="col-md-3"><label class="form-label" for="growth-from">Effective from</label><input id="growth-from" class="form-control" name="effectiveFrom" type="date" th:value="${today}" required></div>
        <div class="col-md-3"><button class="btn btn-outline-primary">Save growth assumption</button></div>
      </form>
      <hr>
      <h3 class="h4">Effective-dated growth periods</h3>
      <div class="text-secondary mb-3" th:if="${#lists.isEmpty(valuationPeriods)}">No growth periods configured.</div>
      <div class="border rounded p-3 mb-2" th:each="period : ${valuationPeriods}">
        <form class="row g-2 align-items-end" method="post" th:action="@{/long-term-assets/{id}/valuation-periods/{periodId}(id=${asset.id},periodId=${period.id})}">
          <input type="hidden" name="portfolioId" th:value="${portfolioId}">
          <div class="col-md-3"><label class="form-label">From</label><input class="form-control" name="validFrom" type="date" th:value="${period.validFrom}" required></div>
          <div class="col-md-3"><label class="form-label">To</label><input class="form-control" name="validTo" type="date" th:value="${period.validTo}"></div>
          <div class="col-md-3"><label class="form-label">Annual growth</label><div class="input-group"><input class="form-control" name="expectedAnnualGrowthRatePercent" type="number" step="0.01" min="-100" max="100" th:value="${T(com.smartbox.investory.ui.presentation.UiPresentation).percentageInput(period.expectedAnnualGrowthRate)}" required><span class="input-group-text">%</span></div></div>
          <div class="col-md-3"><button class="btn btn-outline-primary">Update period</button></div>
        </form>
        <form class="mt-2" method="post" th:action="@{/long-term-assets/{id}/valuation-periods/{periodId}/delete(id=${asset.id},periodId=${period.id})}">
          <input type="hidden" name="portfolioId" th:value="${portfolioId}"><button class="btn btn-sm btn-outline-danger">Delete period</button>
        </form>
      </div>
      <form class="row g-2 align-items-end mt-3" method="post" th:action="@{/long-term-assets/{id}/valuation-periods(id=${asset.id})}">
        <input type="hidden" name="portfolioId" th:value="${portfolioId}">
        <div class="col-md-3"><label class="form-label">From</label><input class="form-control" name="validFrom" type="date" required></div>
        <div class="col-md-3"><label class="form-label">To</label><input class="form-control" name="validTo" type="date"></div>
        <div class="col-md-3"><label class="form-label">Annual growth</label><div class="input-group"><input class="form-control" name="expectedAnnualGrowthRatePercent" type="number" step="0.01" min="-100" max="100" required><span class="input-group-text">%</span></div></div>
        <div class="col-md-3"><button class="btn btn-outline-primary">Add period</button></div>
      </form>
    </div>
  </details>
</th:block>
