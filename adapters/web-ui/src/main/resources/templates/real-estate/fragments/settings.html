<!-- Real-estate property settings. -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="settings">
  <details class="card mb-4 iv-property-settings" id="property-settings">
    <summary class="card-header iv-property-disclosure"><span class="card-title mb-0">Property settings</span></summary>
    <div class="card-body">
      <form method="post" th:action="@{/portfolios/{portfolioId}/long-term-assets/real-estate(portfolioId=${portfolioId})}">
        <input type="hidden" name="portfolioId" th:value="${portfolioId}">
        <input type="hidden" name="id" th:value="${asset.id}">
        <div class="row g-3">
          <div class="col-lg-6"><label class="form-label" for="property-name">Name</label><input id="property-name" class="form-control" name="name" th:value="${asset.name}" required></div>
          <div class="col-sm-6 col-lg-3"><label class="form-label" for="property-currency">Currency</label><input type="hidden" name="currency" th:value="${asset.currency}"><input id="property-currency" class="form-control" th:value="${asset.currency}" readonly aria-readonly="true"></div>
          <div class="col-sm-6 col-lg-3"><label class="form-label" for="property-value">Current value</label><input id="property-value" class="form-control" name="value" type="number" step="0.01" min="0" th:value="${T(com.smartbox.investory.ui.presentation.UiPresentation).moneyInput(asset.value)}" required></div>
          <div class="col-sm-6 col-lg-3"><label class="form-label" for="purchase-date">Acquisition date</label><input id="purchase-date" class="form-control" name="acquisitionDate" type="date" th:value="${asset.acquisitionDate}"></div>
          <div class="col-lg-6"><label class="form-label" for="land-register-number">Land register number</label><input id="land-register-number" class="form-control" name="landRegisterNumber" th:value="${asset.landRegisterNumber}"></div>
          <div class="col-sm-6 col-lg-3"><label class="form-label" for="tax-base">Annual rental tax base</label><input id="tax-base" class="form-control" name="taxBase" type="number" step="0.01" min="0" th:value="${asset.taxBase == null ? '' : T(com.smartbox.investory.ui.presentation.UiPresentation).moneyInput(asset.taxBase)}"></div>
          <div class="col-12"><label class="form-label" for="property-notes">Notes</label><textarea id="property-notes" class="form-control" name="notes" rows="3" th:text="${asset.notes}"></textarea></div>
        </div>
        <div class="mt-3"><button class="btn btn-primary" type="submit">Save property</button></div>
      </form>
    </div>
  </details>
</th:block>
