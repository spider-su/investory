<!-- Reusable real-estate contract form fields. -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="fields(prefix, form, includeRollover)" th:if="${form != null}">
  <div class="iv-contract-edit-groups">
    <fieldset class="iv-contract-edit-group"><legend>Tenant</legend><div class="iv-contract-fields iv-contract-fields--tenant">
      <div><label class="form-label" th:for="${prefix + '-tenant-name'}">Tenant name</label><input class="form-control" th:id="${prefix + '-tenant-name'}" name="tenantName" maxlength="200" th:value="${form?.tenantName}"></div>
      <div><label class="form-label" th:for="${prefix + '-tenant-email'}">Email</label><input class="form-control" th:id="${prefix + '-tenant-email'}" name="tenantEmail" type="email" maxlength="320" th:value="${form?.tenantEmail}"></div>
      <div><label class="form-label" th:for="${prefix + '-tenant-phone'}">Phone</label><input class="form-control" th:id="${prefix + '-tenant-phone'}" name="tenantPhone" type="tel" maxlength="50" th:value="${form?.tenantPhone}"></div>
    </div></fieldset>
    <fieldset class="iv-contract-edit-group"><legend>Period</legend><div class="iv-contract-fields">
      <div><label class="form-label" th:for="${prefix + '-start-date'}">Start date</label><input class="form-control" th:id="${prefix + '-start-date'}" name="startDate" type="date" th:value="${rentalRejectedValues != null and rentalRejectedValues.containsKey('startDate') ? rentalRejectedValues['startDate'] : form?.startDate}" required></div>
      <div><label class="form-label" th:for="${prefix + '-expected-end'}">Expected end</label><input class="form-control" th:id="${prefix + '-expected-end'}" name="endDate" type="date" th:value="${rentalRejectedValues != null and rentalRejectedValues.containsKey('endDate') ? rentalRejectedValues['endDate'] : form?.endDate}"></div>
      <label class="form-check iv-rollover-option" th:if="${includeRollover}" th:for="${prefix + '-rollover'}"><input class="form-check-input" th:id="${prefix + '-rollover'}" type="checkbox" name="endCurrentContractBeforeStart" value="true" th:checked="${form?.endCurrentContractBeforeStart ?: false}"><span class="form-check-label">End the current contract the day before this contract starts</span></label>
    </div></fieldset>
    <fieldset class="iv-contract-edit-group"><legend>Monthly income</legend>
      <div class="iv-term-edit-row"><label th:for="${prefix + '-rent'}">Rent</label><input class="form-control" th:id="${prefix + '-rent'}" name="rent" type="number" min="0" step="0.01" th:value="${rentalRejectedValues != null and rentalRejectedValues.containsKey('rent') ? rentalRejectedValues['rent'] : form?.rent}"><select class="form-select" th:id="${prefix + '-rent-frequency'}" name="rentFrequency" th:aria-label="${'Rent frequency ' + prefix}"><option value="MONTHLY" th:selected="${form?.rentFrequency?.name() == 'MONTHLY'}">Monthly</option><option value="ANNUAL" th:selected="${form?.rentFrequency?.name() == 'ANNUAL'}">Annual</option></select></div>
      <div class="iv-term-edit-row"><label th:for="${prefix + '-parking'}">Parking</label><input class="form-control" th:id="${prefix + '-parking'}" name="parkingRent" type="number" min="0" step="0.01" th:value="${form?.parkingRent}"><select class="form-select" th:id="${prefix + '-parking-frequency'}" name="parkingRentFrequency" th:aria-label="${'Parking frequency ' + prefix}"><option value="MONTHLY" th:selected="${form?.parkingRentFrequency?.name() == 'MONTHLY'}">Monthly</option><option value="ANNUAL" th:selected="${form?.parkingRentFrequency?.name() == 'ANNUAL'}">Annual</option></select></div>
      <div class="iv-term-edit-row"><label th:for="${prefix + '-other-income'}">Other income</label><input class="form-control" th:id="${prefix + '-other-income'}" name="otherIncome" type="number" min="0" step="0.01" th:value="${form?.otherIncome}"><select class="form-select" th:id="${prefix + '-other-income-frequency'}" name="otherIncomeFrequency" th:aria-label="${'Other income frequency ' + prefix}"><option value="MONTHLY" th:selected="${form?.otherIncomeFrequency?.name() == 'MONTHLY'}">Monthly</option><option value="ANNUAL" th:selected="${form?.otherIncomeFrequency?.name() == 'ANNUAL'}">Annual</option></select></div>
    </fieldset>
    <fieldset class="iv-contract-edit-group"><legend>Monthly expenses</legend>
      <div class="iv-term-edit-row iv-term-edit-row--payer"><label th:for="${prefix + '-administration'}">Administration</label><input class="form-control" th:id="${prefix + '-administration'}" name="administrationFee" type="number" min="0" step="0.01" th:value="${form?.administrationFee}"><select class="form-select" th:id="${prefix + '-administration-frequency'}" name="administrationFeeFrequency" th:aria-label="${'Administration frequency ' + prefix}"><option value="MONTHLY" th:selected="${form?.administrationFeeFrequency?.name() == 'MONTHLY'}">Monthly</option><option value="ANNUAL" th:selected="${form?.administrationFeeFrequency?.name() == 'ANNUAL'}">Annual</option></select><select class="form-select" th:id="${prefix + '-administration-payer'}" name="administrationFeePaidByTenant" th:aria-label="${'Administration payer ' + prefix}"><option value="false" th:selected="${!(form?.administrationFeePaidByTenant ?: false)}">Landlord pays</option><option value="true" th:selected="${form?.administrationFeePaidByTenant ?: false}">Tenant pays</option></select></div>
      <div class="iv-term-edit-row iv-term-edit-row--payer"><label th:for="${prefix + '-utilities'}">Utilities</label><input class="form-control" th:id="${prefix + '-utilities'}" name="utilities" type="number" min="0" step="0.01" th:value="${form?.utilities}"><select class="form-select" th:id="${prefix + '-utilities-frequency'}" name="utilitiesFrequency" th:aria-label="${'Utilities frequency ' + prefix}"><option value="MONTHLY" th:selected="${form?.utilitiesFrequency?.name() == 'MONTHLY'}">Monthly</option><option value="ANNUAL" th:selected="${form?.utilitiesFrequency?.name() == 'ANNUAL'}">Annual</option></select><select class="form-select" th:id="${prefix + '-utilities-payer'}" name="utilitiesPaidByTenant" th:aria-label="${'Utilities payer ' + prefix}"><option value="false" th:selected="${!(form?.utilitiesPaidByTenant ?: false)}">Landlord pays</option><option value="true" th:selected="${form?.utilitiesPaidByTenant ?: false}">Tenant pays</option></select></div>
      <div class="iv-term-edit-row iv-term-edit-row--payer"><label th:for="${prefix + '-other-expense'}">Other expense</label><input class="form-control" th:id="${prefix + '-other-expense'}" name="otherExpense" type="number" min="0" step="0.01" th:value="${form?.otherExpense}"><select class="form-select" th:id="${prefix + '-other-expense-frequency'}" name="otherExpenseFrequency" th:aria-label="${'Other expense frequency ' + prefix}"><option value="MONTHLY" th:selected="${form?.otherExpenseFrequency?.name() == 'MONTHLY'}">Monthly</option><option value="ANNUAL" th:selected="${form?.otherExpenseFrequency?.name() == 'ANNUAL'}">Annual</option></select><select class="form-select" th:id="${prefix + '-other-expense-payer'}" name="otherExpensePaidByTenant" th:aria-label="${'Other expense payer ' + prefix}"><option value="false" th:selected="${!(form?.otherExpensePaidByTenant ?: false)}">Landlord pays</option><option value="true" th:selected="${form?.otherExpensePaidByTenant ?: false}">Tenant pays</option></select></div>
    </fieldset>
    <fieldset class="iv-contract-edit-group"><legend>Annual expenses</legend>
      <div class="iv-term-edit-row iv-term-edit-row--payer"><label th:for="${prefix + '-property-tax'}">Property tax</label><input class="form-control" th:id="${prefix + '-property-tax'}" name="annualPropertyTax" type="number" min="0" step="0.01" th:value="${form?.annualPropertyTax}"><select class="form-select" th:id="${prefix + '-property-tax-frequency'}" name="propertyTaxFrequency" th:aria-label="${'Property tax frequency ' + prefix}"><option value="ANNUAL" th:selected="${form?.propertyTaxFrequency?.name() == 'ANNUAL'}">Annual</option><option value="MONTHLY" th:selected="${form?.propertyTaxFrequency?.name() == 'MONTHLY'}">Monthly</option></select><select class="form-select" th:id="${prefix + '-property-tax-payer'}" name="propertyTaxPaidByTenant" th:aria-label="${'Property tax payer ' + prefix}"><option value="false" th:selected="${!(form?.propertyTaxPaidByTenant ?: false)}">Landlord pays</option><option value="true" th:selected="${form?.propertyTaxPaidByTenant ?: false}">Tenant pays</option></select></div>
      <div class="iv-term-edit-row iv-term-edit-row--payer"><label th:for="${prefix + '-insurance'}">Insurance</label><input class="form-control" th:id="${prefix + '-insurance'}" name="annualInsurance" type="number" min="0" step="0.01" th:value="${form?.annualInsurance}"><select class="form-select" th:id="${prefix + '-insurance-frequency'}" name="insuranceFrequency" th:aria-label="${'Insurance frequency ' + prefix}"><option value="ANNUAL" th:selected="${form?.insuranceFrequency?.name() == 'ANNUAL'}">Annual</option><option value="MONTHLY" th:selected="${form?.insuranceFrequency?.name() == 'MONTHLY'}">Monthly</option></select><select class="form-select" th:id="${prefix + '-insurance-payer'}" name="insurancePaidByTenant" th:aria-label="${'Insurance payer ' + prefix}"><option value="false" th:selected="${!(form?.insurancePaidByTenant ?: false)}">Landlord pays</option><option value="true" th:selected="${form?.insurancePaidByTenant ?: false}">Tenant pays</option></select></div>
    </fieldset>
    <fieldset class="iv-contract-edit-group"><legend>Rental tax</legend><div class="iv-contract-fields"><div><label class="form-label" th:for="${prefix + '-monthly-tax-base'}">Monthly tax base</label><input class="form-control" th:id="${prefix + '-monthly-tax-base'}" name="monthlyTaxBase" type="number" min="0" step="0.01" th:value="${form?.monthlyTaxBase}" placeholder="Property default"></div><div><label class="form-label" th:for="${prefix + '-tax-ownership'}">Tax payer</label><select class="form-select" th:id="${prefix + '-tax-ownership'}" name="rentalTaxOwnership"><option value="INHERIT" th:selected="${form?.rentalTaxOwnership == 'INHERIT' or form?.rentalTaxOwnership == null}">Use property default</option><option value="LANDLORD" th:selected="${form?.rentalTaxOwnership == 'LANDLORD'}">Paid by landlord</option><option value="TENANT" th:selected="${form?.rentalTaxOwnership == 'TENANT'}">Paid by tenant</option></select></div></div></fieldset>
  </div>
</th:block>
