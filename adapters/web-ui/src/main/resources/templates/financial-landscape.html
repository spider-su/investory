<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Financial Landscape · Investory</title>
  <link href="/favicon.svg" rel="icon" type="image/svg+xml">
  <link href="/css/financial-landscape.css" rel="stylesheet">
</head>
<body class="fl-body fl-landscape-page">
<main class="fl-app">
  <header class="fl-header">
    <div><h1>INVESTORY LANDSCAPE</h1></div>
    <div class="fl-actions">
      <a th:href="@{/portfolios/{id}/investment-profile(id=${portfolioId})}" class="fl-button">← Profile</a>
      <a th:href="@{/portfolios/{id}/financial-landscape(id=${portfolioId},view=compact)}" class="fl-button">Compact</a>
      <button type="button" id="fl-fullscreen" class="fl-button">Fullscreen</button>
    </div>
  </header>
  <section class="fl-scene fl-clean-plate" aria-label="Financial landscape">
    <div class="fl-stars" aria-hidden="true"></div><div class="fl-atmosphere" aria-hidden="true"></div><div class="fl-lake" aria-hidden="true"></div>
    <div class="fl-horizon" aria-hidden="true"></div>
    <div class="fl-zero-line" aria-hidden="true"></div>
    <div class="fl-cloud fl-cloud--cash" aria-hidden="true"></div>
    <div class="fl-cloud fl-cloud--market" aria-hidden="true"></div>
    <svg class="fl-income-vapor" aria-hidden="true" viewBox="0 0 1000 600" preserveAspectRatio="none">
      <defs>
        <linearGradient id="fl-warm-vapor" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#d6ad66" stop-opacity=".4"/><stop offset=".6" stop-color="#f4ce8b" stop-opacity=".95"/><stop offset="1" stop-color="#fff1c6" stop-opacity=".55"/></linearGradient>
        <linearGradient id="fl-cool-vapor" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#88b7db" stop-opacity=".38"/><stop offset=".6" stop-color="#a9d2f1" stop-opacity=".92"/><stop offset="1" stop-color="#e3f3ff" stop-opacity=".5"/></linearGradient>
        <filter id="fl-vapor-glow"><feGaussianBlur stdDeviation="5"/></filter>
      </defs>
      <g class="fl-vapor fl-vapor--cash">
        <path class="fl-vapor-haze" d="M 154 357 C 150 312 176 238 260 194 S 321 153 397 150" stroke="#e4bd75"/>
        <path class="fl-vapor-core" d="M 154 357 C 150 312 176 238 260 194 S 321 153 397 150" stroke="url(#fl-warm-vapor)"/>
      </g>
      <g class="fl-vapor fl-vapor--market">
        <path class="fl-vapor-haze" d="M 905 172 C 870 137 819 114 749 119 S 673 145 620 150" stroke="#98bfde"/>
        <path class="fl-vapor-core" d="M 905 172 C 870 137 819 114 749 119 S 673 145 620 150" stroke="url(#fl-cool-vapor)"/>
      </g>
    </svg>
    <div class="fl-mountain fl-mountain--far" aria-hidden="true"></div>
    <div class="fl-mountain fl-mountain--near" aria-hidden="true"></div>
    <div class="fl-dune" aria-hidden="true"><div class="fl-dune-ridge"></div></div>
    <div class="fl-asset-guide fl-asset-guide--mountain" aria-label="Long term assets">
      <span class="fl-asset-guide-label">Long term <strong id="fl-mountain-value">—</strong></span>
    </div>
    <div class="fl-asset-guide fl-asset-guide--dune" aria-label="Liquid assets">
      <span class="fl-asset-guide-label">Liquid <strong id="fl-dune-value">—</strong></span>
    </div>
    <div id="fl-spending-field" class="fl-spending-field" aria-label="Monthly spending destinations">
      <p class="fl-spending-empty">Spending categories are unavailable for this plan.</p>
    </div>
    <div class="fl-hourglass" aria-hidden="true">
      <svg viewBox="0 0 929 1693" role="img">
        <image href="/images/financial-landscape-hourglass-v1.webp" width="929" height="1693"/>
        <path class="fl-stream" d="M464.5 895V1310" stroke="#ffe1a0" stroke-width="12"/>
      </svg>
    </div>
    <div class="fl-center">
      <span>MONTHLY BALANCE</span>
      <div class="fl-monthly-totals">
        <div><span>Income</span><strong id="fl-income">—</strong></div>
        <div><span>Expenses</span><strong id="fl-expenses">—</strong></div>
      </div>
      <strong id="fl-net">—</strong>
      
      <div class="fl-income-legend"><span class="fl-legend-cash">Base <b id="fl-cash-income">—</b></span><span class="fl-legend-market">Market <b id="fl-market-result">—</b></span></div>
      <div class="fl-coverage-track" role="progressbar" aria-label="Income coverage of monthly expenses" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="fl-coverage-bar"><div id="fl-coverage-fill"><div id="fl-coverage-base"></div><div id="fl-coverage-market"></div></div></div>
      <small id="fl-coverage">—</small>
      <small id="fl-annual-gap">—</small>

    </div>
  </section>
</main>
<script th:inline="javascript">
  window.financialLandscape = /*[[${landscape}]]*/ {};
</script>
<script src="/js/financial-landscape.js" defer></script>
<script src="/js/financial-landscape-scene.js" defer></script>
<script src="/js/financial-landscape-particles.js" defer></script>
</body>
</html>
