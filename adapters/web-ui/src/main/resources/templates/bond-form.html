<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/theme-head :: theme}"></th:block><meta charset="UTF-8"><title>Bond · Investory</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="/css/tabler.min.css" rel="stylesheet"><link href="/css/planning.css" rel="stylesheet"></head>
<body><main class="iv-app iv-planning-page iv-long-term-form-page">
  <div th:replace="~{fragments/long-term-form-header :: header(${asset?.id == null ? 'Add bond' : 'Edit bond'}, 'Fixed-income asset details.', ${portfolioId})}"></div>
  <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}">Validation error.</div>
  <form class="card iv-long-term-form" method="post" th:action="@{/portfolios/{portfolioId}/long-term-assets/bond(portfolioId=${portfolioId})}">
    <div class="iv-card-section-header"><span class="iv-card-section-header__title">Bond details</span></div>
    <div class="card-body iv-long-term-form__body"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><input type="hidden" name="id" th:value="${asset?.id}"><div class="row g-3">
      <div class="col-md-6"><label class="form-label" for="bond-name">Name</label><input id="bond-name" class="form-control" name="name" th:value="${asset?.name}" required></div>
      <div class="col-md-3"><label class="form-label" for="bond-currency">Currency</label><select id="bond-currency" class="form-select" name="currency" required><option th:each="currency : ${T(com.smartbox.investory.shared.currency.CurrencyType).values()}" th:value="${currency}" th:text="${currency}" th:selected="${currency == asset?.currency}"></option></select></div>
      <div class="col-md-3"><label class="form-label" for="bond-value">Value</label><input id="bond-value" class="form-control" name="value" type="number" step="0.01" min="0" th:value="${asset?.value == null ? '' : T(com.smartbox.investory.ui.presentation.UiPresentation).moneyInput(asset.value)}" required></div>
      <div class="col-md-4"><label class="form-label" for="bond-date">Acquisition date</label><input id="bond-date" class="form-control" name="acquisitionDate" type="date" th:value="${asset?.acquisitionDate}" required></div>
      <div class="col-md-4"><label class="form-label" for="bond-maturity">Maturity date</label><input id="bond-maturity" class="form-control" name="maturityDate" type="date" th:value="${asset?.maturityDate}" required></div>
      <div class="col-md-4"><label class="form-label" for="bond-rate">Interest rate</label><div class="input-group"><input id="bond-rate" class="form-control" name="annualRatePercent" type="number" step="0.01" min="0" max="100" th:value="${asset?.annualRatePercent == null ? '' : T(com.smartbox.investory.ui.presentation.UiPresentation).decimalInput(asset.annualRatePercent)}" required><span class="input-group-text">%</span></div></div>
      <div class="col-12"><label class="form-label" for="bond-notes">Notes</label><textarea id="bond-notes" class="form-control" name="notes" rows="3" th:text="${asset?.notes}"></textarea></div>
    </div></div>
    <div class="card-footer iv-long-term-form__actions"><button class="btn btn-primary">Save bond</button><a class="btn btn-link" th:href="@{/portfolios/{portfolioId}/long-term-assets(portfolioId=${portfolioId})}">Cancel</a></div>
  </form>
</main><div th:replace="~{fragments/app-footer :: buildFooter}"></div></body></html>
