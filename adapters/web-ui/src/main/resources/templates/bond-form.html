<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/theme-head :: theme}"></th:block><meta charset="UTF-8"><title>New bond · Investory</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="/css/tabler.min.css" rel="stylesheet"></head>
<body><main class="container-xl py-4"><div class="d-flex justify-content-between align-items-center mb-4"><h1>New bond</h1><a class="btn btn-link" th:href="@{/long-term-assets(portfolioId=${portfolioId})}">Back</a></div>
<form class="card" method="post" action="/long-term-assets/bond"><div class="card-body"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required></div><div class="col-md-3"><label class="form-label">Currency</label><select class="form-select" name="currency"><option th:each="currency : ${T(com.smartbox.investory.shared.currency.CurrencyType).values()}" th:value="${currency}" th:text="${currency}" th:selected="${currency == asset.currency}"></option></select></div><div class="col-md-3"><label class="form-label">Value</label><input class="form-control" name="value" type="number" step="0.01" min="0" required></div><div class="col-md-3"><label class="form-label">Purchase date</label><input class="form-control" name="acquisitionDate" type="date" required></div><div class="col-md-3"><label class="form-label">Maturity date</label><input class="form-control" name="maturityDate" type="date" required></div><div class="col-md-3"><label class="form-label">Interest mode</label><select class="form-select" name="interestTreatment"><option value="CAPITALIZE">Accumulative</option><option value="PAY_OUT">Distributed</option></select></div><div class="col-md-3"><label class="form-label">Expected annual rate</label><div class="input-group"><input class="form-control" name="annualRatePercent" type="number" step="0.001" min="0" max="100" required><span class="input-group-text">%</span></div></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3"></textarea></div></div></div><div class="card-footer"><button class="btn btn-primary">Save bond</button> <a class="btn btn-link" th:href="@{/long-term-assets(portfolioId=${portfolioId})}">Cancel</a></div></form></main></body></html>
