<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ryczalt counterparty</title><link href="/css/tabler.min.css" rel="stylesheet"><th:block th:replace="~{fragments/theme-head :: theme}"></th:block></head>
<body><main class="iv-app iv-planning-page"><div class="container-xl py-4">
  <a th:href="@{/profiles/{profileId}/accounting/counterparties(profileId=${profileId})}">‹ Back to counterparties</a>
  <h1 th:text="${counterparty.displayName}">Counterparty</h1><p th:text="${counterparty.legalName}">Legal name</p>
  <div class="iv-card p-4 mb-4"><form method="post" th:action="@{/profiles/{profileId}/accounting/counterparties/{id}/alias(profileId=${profileId},id=${counterparty.id})}" class="d-flex gap-2"><input class="form-control" name="alias" th:value="${counterparty.alias}" placeholder="Display alias"><button class="btn btn-primary" type="submit">Save alias</button></form></div>
  <h2>Rules</h2>
  <div class="iv-card p-4 mb-4" th:each="rule : ${rules}"><form method="post" th:action="@{/profiles/{profileId}/accounting/counterparties/{id}/rules/{ruleId}(profileId=${profileId},id=${counterparty.id},ruleId=${rule.id})}" class="row g-2"><div class="col-md-4"><input class="form-control" name="name" th:value="${rule.name}" placeholder="Name"></div><div class="col-md-4"><input class="form-control" name="serviceKey" th:value="${rule.serviceKey}" placeholder="Service key"></div><div class="col-md-4"><input class="form-control" name="classification" th:value="${rule.classification}" placeholder="Classification"></div><div class="col-md-4"><input class="form-control" name="documentType" th:value="${rule.documentType}" placeholder="Document type"></div><div class="col-md-4"><input class="form-control" name="vatTreatment" th:value="${rule.vatTreatment}" placeholder="VAT treatment"></div><div class="col-md-2"><input class="form-control" name="vatDeductionRatio" th:value="${rule.vatDeductionRatio}" placeholder="VAT ratio"></div><div class="col-md-2"><input class="form-control" name="ryczaltRate" th:value="${rule.ryczaltRate}" placeholder="Rate"></div><div class="col-md-3"><select class="form-select" name="paymentVerificationPolicy"><option value="REQUIRED" th:selected="${rule.paymentVerificationPolicy == 'REQUIRED'}">Payment required</option><option value="NOT_REQUIRED" th:selected="${rule.paymentVerificationPolicy == 'NOT_REQUIRED'}">Payment not required</option></select></div><div class="col-md-3 form-check"><input class="form-check-input" type="checkbox" name="autoApprove" value="true" th:checked="${rule.autoApprove}"><label class="form-check-label">Auto approve</label></div><div class="col-12"><button class="btn btn-primary btn-sm" type="submit">Save rule</button></div></form><form method="post" th:action="@{/profiles/{profileId}/accounting/counterparties/{id}/rules/{ruleId}/delete(profileId=${profileId},id=${counterparty.id},ruleId=${rule.id})}" class="mt-2"><button class="btn btn-outline-danger btn-sm" type="submit">Delete rule</button></form></div>
  <div class="iv-card p-4"><h3>Add rule</h3><form method="post" th:action="@{/profiles/{profileId}/accounting/counterparties/{id}/rules(profileId=${profileId},id=${counterparty.id})}" class="row g-2"><div class="col-md-4"><input class="form-control" name="name" placeholder="Name" required></div><div class="col-md-4"><input class="form-control" name="serviceKey" placeholder="Service key" required></div><div class="col-md-4"><input class="form-control" name="classification" placeholder="Classification" required></div><div class="col-md-4"><input class="form-control" name="documentType" placeholder="Document type"></div><div class="col-md-4"><input class="form-control" name="vatTreatment" placeholder="VAT treatment"></div><div class="col-md-2"><input class="form-control" name="vatDeductionRatio" placeholder="VAT ratio"></div><div class="col-md-2"><input class="form-control" name="ryczaltRate" placeholder="Rate" required></div><div class="col-md-3"><select class="form-select" name="paymentVerificationPolicy"><option value="REQUIRED">Payment required</option><option value="NOT_REQUIRED">Payment not required</option></select></div><div class="col-md-3 form-check"><input class="form-check-input" type="checkbox" name="autoApprove" value="true"><label class="form-check-label">Auto approve</label></div><div class="col-12"><button class="btn btn-primary" type="submit">Add rule</button></div></form></div>
</div></main></body></html>
