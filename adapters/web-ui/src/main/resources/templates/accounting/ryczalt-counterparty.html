<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ryczalt counterparty</title>
  <link href="/css/tabler.min.css" rel="stylesheet">
  <th:block th:replace="~{fragments/theme-head :: theme}"></th:block>
</head>
<body>
<main class="iv-app iv-planning-page"><div class="container-xl py-4">
  <a th:href="@{/profiles/{profileId}/accounting/counterparties(profileId=${profileId})}">‹ Back to counterparties</a>
  <h1 th:text="${counterparty.displayName}">Counterparty</h1>
  <p th:text="${counterparty.legalName}">Legal name</p>
  <section class="iv-card p-4 mb-4" data-testid="counterparty-bills">
    <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h4 mb-0">Bills</h2><strong th:text="${#numbers.formatDecimal(billsTotal, 1, 'POINT', 2, 'COMMA') + (billsCurrency == '' ? '' : ' ' + billsCurrency)}">0.00</strong></div>
    <div class="accounting-empty" th:if="${bills.isEmpty()}">No bills.</div>
    <div class="table-responsive" th:unless="${bills.isEmpty()}"><table class="table card-table"><thead><tr><th>Invoice</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr th:each="bill : ${bills}"><td th:text="${bill.reference}">Invoice</td><td th:text="${bill.issueDate}">2026-01-15</td><td th:text="${#numbers.formatDecimal(bill.grossAmount, 1, 'POINT', 2, 'COMMA') + ' ' + bill.currency}">0.00 PLN</td><td th:text="${bill.paymentStatus}">UNMATCHED</td></tr></tbody></table></div>
  </section>
  <div class="iv-card p-4 mb-4"><form method="post" th:action="@{/profiles/{profileId}/accounting/counterparties/{id}/alias(profileId=${profileId},id=${counterparty.id})}" class="d-flex gap-2"><input class="form-control" name="alias" th:value="${counterparty.alias}" placeholder="Display alias"><button class="btn btn-primary" type="submit">Save alias</button></form></div>
  <h2>Rules</h2>
  <div class="iv-card p-4 mb-4" th:each="rule : ${rules}">
    <form method="post" th:action="@{/profiles/{profileId}/accounting/counterparties/{id}/rules/{ruleId}(profileId=${profileId},id=${counterparty.id},ruleId=${rule.id})}" class="row g-2 rule-form">
      <div class="col-md-4"><input class="form-control" name="name" th:value="${rule.name}" placeholder="Rule name" required></div>
      <div class="col-md-4"><input class="form-control" name="serviceKey" th:value="${rule.serviceKey}" placeholder="Optional exact service key"></div>
      <div class="col-md-4"><label class="form-label">Profile</label><select class="form-select preset-select" data-custom-target="classification" name="classificationPreset"><option value="VEHICLE" th:selected="${rule.classification == 'VEHICLE'}">Vehicle (50% VAT)</option><option value="OFFICE_COST" th:selected="${rule.classification == 'OFFICE_COST'}">Office cost (100% VAT)</option><option value="OFFICE_SERVICE" th:selected="${rule.classification == 'OFFICE_SERVICE'}">Office service</option><option value="PL_SERVICE" th:selected="${rule.classification == 'PL_SERVICE'}">PL service (12% / 23% VAT)</option><option value="EU_SERVICE" th:selected="${rule.classification == 'EU_SERVICE'}">EU service (12% / 0% VAT)</option><option value="OTHER">Other</option></select><input class="form-control mt-1 custom-value" data-custom-name="classification" name="classification" th:value="${rule.classification}" placeholder="Custom token" required></div>
      <div class="col-md-4"><label class="form-label">Document type</label><select class="form-select" name="documentType"><option value="" th:selected="${rule.documentType == null}">Any document type</option><option value="SALES_INVOICE" th:selected="${rule.documentType == 'SALES_INVOICE'}">Income invoice</option><option value="PURCHASE_INVOICE" th:selected="${rule.documentType == 'PURCHASE_INVOICE'}">Cost invoice</option><option value="RECEIPT" th:selected="${rule.documentType == 'RECEIPT'}">Receipt</option><option value="CREDIT_NOTE" th:selected="${rule.documentType == 'CREDIT_NOTE'}">Credit note</option></select></div>
      <div class="col-md-4"><label class="form-label">VAT treatment</label><select class="form-select preset-select" data-custom-target="vatTreatment" name="vatTreatmentPreset"><option value="" th:selected="${rule.vatTreatment == null}">Not specified</option><option value="DOMESTIC_VAT" th:selected="${rule.vatTreatment == 'DOMESTIC_VAT'}">Domestic VAT</option><option value="EU_B2B_REVERSE_CHARGE" th:selected="${rule.vatTreatment == 'EU_B2B_REVERSE_CHARGE'}">EU B2B reverse charge</option><option value="NON_EU_B2B_OUTSIDE_POLAND" th:selected="${rule.vatTreatment == 'NON_EU_B2B_OUTSIDE_POLAND'}">Non-EU B2B outside Poland</option><option value="VAT_EXEMPT" th:selected="${rule.vatTreatment == 'VAT_EXEMPT'}">VAT exempt</option><option value="DOMESTIC_PURCHASE" th:selected="${rule.vatTreatment == 'DOMESTIC_PURCHASE'}">Domestic purchase</option><option value="IMPORT_OF_SERVICES_EU" th:selected="${rule.vatTreatment == 'IMPORT_OF_SERVICES_EU'}">Import of services from EU</option><option value="IMPORT_OF_SERVICES_NON_EU" th:selected="${rule.vatTreatment == 'IMPORT_OF_SERVICES_NON_EU'}">Import of services from outside EU</option><option value="OTHER">Other</option></select><input class="form-control mt-1 custom-value" data-custom-name="vatTreatment" name="vatTreatment" th:value="${rule.vatTreatment}" placeholder="Custom token"></div>
      <div class="col-md-2"><label class="form-label">VAT ratio</label><select class="form-select" name="vatDeductionRatio"><option value="" th:selected="${rule.vatDeductionRatio == null}">Not specified</option><option value="0" th:selected="${rule.vatDeductionRatio == 0}">0%</option><option value="0.5" th:selected="${rule.vatDeductionRatio == 0.5}">50%</option><option value="1" th:selected="${rule.vatDeductionRatio == 1}">100%</option></select></div>
      <div class="col-md-2"><label class="form-label">Ryczalt rate</label><select class="form-select preset-select" data-custom-target="ryczaltRate" name="ryczaltRatePreset"><option value="">Not applicable</option><option value="2" th:selected="${rule.ryczaltRate == 2}">2%</option><option value="3" th:selected="${rule.ryczaltRate == 3}">3%</option><option value="5.5" th:selected="${rule.ryczaltRate == 5.5}">5.5%</option><option value="8.5" th:selected="${rule.ryczaltRate == 8.5}">8.5%</option><option value="10" th:selected="${rule.ryczaltRate == 10}">10%</option><option value="12" th:selected="${rule.ryczaltRate == 12}">12%</option><option value="12.5" th:selected="${rule.ryczaltRate == 12.5}">12.5%</option><option value="14" th:selected="${rule.ryczaltRate == 14}">14%</option><option value="15" th:selected="${rule.ryczaltRate == 15}">15%</option><option value="17" th:selected="${rule.ryczaltRate == 17}">17%</option><option value="OTHER">Other</option></select><input class="form-control mt-1 custom-value" data-custom-name="ryczaltRate" name="ryczaltRate" type="number" min="0" max="100" step="0.01" th:value="${rule.ryczaltRate}" placeholder="Custom %"></div>
      <div class="col-md-3"><label class="form-label">Payment verification</label><select class="form-select" name="paymentVerificationPolicy"><option value="REQUIRED" th:selected="${rule.paymentVerificationPolicy == 'REQUIRED'}">Payment required</option><option value="NOT_REQUIRED" th:selected="${rule.paymentVerificationPolicy == 'NOT_REQUIRED'}">Payment not required</option></select></div><div class="col-md-3 form-check"><input class="form-check-input" type="checkbox" name="autoApprove" value="true" th:checked="${rule.autoApprove}"><label class="form-check-label">Auto approve</label></div><div class="col-12"><button class="btn btn-primary btn-sm" type="submit">Save rule</button></div>
    </form>
    <form method="post" th:action="@{/profiles/{profileId}/accounting/counterparties/{id}/rules/{ruleId}/delete(profileId=${profileId},id=${counterparty.id},ruleId=${rule.id})}" class="mt-2"><button class="btn btn-outline-danger btn-sm" type="submit">Delete rule</button></form>
  </div>
  <div class="iv-card p-4"><h3>Add rule</h3>
    <form method="post" th:action="@{/profiles/{profileId}/accounting/counterparties/{id}/rules(profileId=${profileId},id=${counterparty.id})}" class="row g-2 rule-form">
      <div class="col-md-4"><label class="form-label">Name</label><input class="form-control" name="name" placeholder="Rule name" required></div><div class="col-md-4"><label class="form-label">Service key</label><input class="form-control" name="serviceKey" placeholder="Optional exact service key"></div>
      <div class="col-md-4"><label class="form-label">Profile</label><select class="form-select preset-select" data-custom-target="classification" name="classificationPreset"><option value="VEHICLE">Vehicle (50% VAT)</option><option value="OFFICE_COST">Office cost (100% VAT)</option><option value="OFFICE_SERVICE">Office service</option><option value="PL_SERVICE">PL service (12% / 23% VAT)</option><option value="EU_SERVICE">EU service (12% / 0% VAT)</option><option value="OTHER">Other</option></select><input class="form-control mt-1 custom-value" data-custom-name="classification" name="classification" placeholder="Custom token" required></div>
      <div class="col-md-4"><label class="form-label">Document type</label><select class="form-select" name="documentType"><option value="">Any document type</option><option value="SALES_INVOICE">Income invoice</option><option value="PURCHASE_INVOICE">Cost invoice</option><option value="RECEIPT">Receipt</option><option value="CREDIT_NOTE">Credit note</option></select></div>
      <div class="col-md-4"><label class="form-label">VAT treatment</label><select class="form-select preset-select" data-custom-target="vatTreatment" name="vatTreatmentPreset"><option value="">Not specified</option><option value="DOMESTIC_VAT">Domestic VAT</option><option value="EU_B2B_REVERSE_CHARGE">EU B2B reverse charge</option><option value="NON_EU_B2B_OUTSIDE_POLAND">Non-EU B2B outside Poland</option><option value="VAT_EXEMPT">VAT exempt</option><option value="DOMESTIC_PURCHASE">Domestic purchase</option><option value="IMPORT_OF_SERVICES_EU">Import of services from EU</option><option value="IMPORT_OF_SERVICES_NON_EU">Import of services from outside EU</option><option value="OTHER">Other</option></select><input class="form-control mt-1 custom-value" data-custom-name="vatTreatment" name="vatTreatment" placeholder="Custom token"></div>
      <div class="col-md-2"><label class="form-label">VAT ratio</label><select class="form-select" name="vatDeductionRatio"><option value="">Not specified</option><option value="0">0%</option><option value="0.5">50%</option><option value="1">100%</option></select></div><div class="col-md-2"><label class="form-label">Ryczalt rate</label><select class="form-select preset-select" data-custom-target="ryczaltRate" name="ryczaltRatePreset"><option value="">Not applicable</option><option value="2">2%</option><option value="3">3%</option><option value="5.5">5.5%</option><option value="8.5">8.5%</option><option value="10">10%</option><option value="12">12%</option><option value="12.5">12.5%</option><option value="14">14%</option><option value="15">15%</option><option value="17">17%</option><option value="OTHER">Other</option></select><input class="form-control mt-1 custom-value" data-custom-name="ryczaltRate" name="ryczaltRate" type="number" min="0" max="100" step="0.01" placeholder="Custom %"></div>
      <div class="col-md-3"><label class="form-label">Payment verification</label><select class="form-select" name="paymentVerificationPolicy"><option value="REQUIRED">Payment required</option><option value="NOT_REQUIRED">Payment not required</option></select></div><div class="col-md-3 form-check"><input class="form-check-input" type="checkbox" name="autoApprove" value="true"><label class="form-check-label">Auto approve</label></div><div class="col-12"><button class="btn btn-primary" type="submit">Add rule</button></div>
    </form>
  </div>
</div></main>
<script>
(() => {
  document.querySelectorAll('.rule-form').forEach(form => {
    form.querySelectorAll('.preset-select').forEach(select => {
      const custom = form.querySelector('[data-custom-name="' + select.dataset.customTarget + '"]');
      if (!custom) return;
      const presetValues = [...select.options].map(option => option.value);
      if (custom.value && !presetValues.includes(custom.value)) select.value = 'OTHER';
      if (custom.dataset.customName === 'ryczaltRate' && (!['PL_SERVICE', 'EU_SERVICE'].includes(form.querySelector('[name="classification"]')?.value) || form.querySelector('[name="documentType"]')?.value !== 'SALES_INVOICE')) select.value = '';
      const sync = () => {
        const preset = select.value;
        const isCustom = preset === 'OTHER';
        custom.readOnly = !isCustom;
        custom.required = isCustom || custom.dataset.customName === 'classification';
        if (!isCustom) custom.value = preset;
      };
      select.addEventListener('change', sync);
      sync();
    });
    const refreshRate = () => form.querySelector('[name="ryczaltRatePreset"]')?.dispatchEvent(new Event('change'));
    form.querySelector('[name="classificationPreset"]')?.addEventListener('change', refreshRate);
    form.querySelector('[name="documentType"]')?.addEventListener('change', refreshRate);
  });
})();
</script>
</body>
</html>
