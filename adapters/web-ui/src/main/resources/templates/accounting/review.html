<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Review accounting document</title><link href="/css/tabler.min.css" rel="stylesheet"><th:block th:replace="~{fragments/theme-head :: theme}"></th:block></head>
<body><main class="iv-app iv-planning-page"><div class="container-xl py-4"><h1>Review accounting document</h1><p class="text-secondary">Check the recognized values before importing. Unknown tax values must be corrected or left for review.</p>
<form method="post" action="/accounting/documents/save"><input type="hidden" name="profileId" th:value="${profileId}"><input type="hidden" name="month" th:value="${selectedMonth}"><input type="hidden" name="sourceReference" th:value="${candidate.sourceReference}"><input type="hidden" name="taxPeriod" th:value="${selectedMonth}">
<div class="row g-3"><div class="col-md-6"><label class="form-label">Document type</label><input class="form-control" name="documentType" th:value="${candidate.documentType}" required></div><div class="col-md-6"><label class="form-label">Reference</label><input class="form-control" name="reference" th:value="${candidate.reference}" required></div><div class="col-md-4"><label class="form-label">Issue date</label><input class="form-control" type="date" name="issueDate" th:value="${candidate.issueDate}"></div><div class="col-md-4"><label class="form-label">Sale date</label><input class="form-control" type="date" name="saleDate" th:value="${candidate.saleDate}"></div><div class="col-md-4"><label class="form-label">Due date</label><input class="form-control" type="date" name="dueDate" th:value="${candidate.dueDate}"></div><div class="col-md-6"><label class="form-label">Counterparty</label><input class="form-control" name="counterpartyAlias" th:value="${candidate.seller ?: candidate.buyer}"></div><div class="col-md-6"><label class="form-label">Counterparty tax identifier</label><input class="form-control" name="counterpartyTaxIdentifier"></div><div class="col-md-4"><label class="form-label">Category</label><input class="form-control" name="category" th:value="${candidate.category}" required></div><div class="col-md-4"><label class="form-label">Currency</label><input class="form-control" name="currency" th:value="${candidate.currency}" required></div><div class="col-md-4"><label class="form-label">VAT deduction ratio</label><input class="form-control" name="vatDeductionRatio" value="1.00" required></div><div class="col-md-4"><label class="form-label">Net</label><input class="form-control" name="netAmount" th:value="${candidate.netAmount}" required></div><div class="col-md-4"><label class="form-label">VAT</label><input class="form-control" name="vatAmount" th:value="${candidate.vatAmount}" required></div><div class="col-md-4"><label class="form-label">Gross</label><input class="form-control" name="grossAmount" th:value="${candidate.grossAmount}" required></div><div class="col-12"><label class="form-label">Note</label><textarea class="form-control" name="note" th:text="${candidate.note}"></textarea></div></div><div class="mt-3"><button class="btn btn-primary">Import reviewed document</button><a class="btn btn-link" th:href="@{/accounting(profileId=${profileId},month=${selectedMonth})}">Cancel</a></div></form></div></main></body></html>
