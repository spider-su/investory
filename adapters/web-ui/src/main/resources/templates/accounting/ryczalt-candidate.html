<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Review Ryczalt invoice</title><link href="/css/tabler.min.css" rel="stylesheet"><th:block th:replace="~{fragments/theme-head :: theme}"></th:block></head>
<body><main class="iv-app iv-planning-page"><div class="container-xl py-4">
  <a th:href="@{/profiles/{profileId}/accounting(profileId=${profileId})}">‹ Back to accounting</a>
  <h1>Review invoice candidate</h1>
  <p class="text-secondary" th:text="${candidate.sourceState + ' · ' + candidate.reference}">NEW_CANDIDATE · invoice.pdf</p>
  <div class="iv-card p-4"><dl class="row"><dt class="col-sm-3">Issue date</dt><dd class="col-sm-9" th:text="${candidate.issueDate}">2026-01-01</dd><dt class="col-sm-3">Amount</dt><dd class="col-sm-9" th:text="${candidate.grossAmount + ' ' + candidate.currency}">100 PLN</dd><dt class="col-sm-3">Required inputs</dt><dd class="col-sm-9" th:text="${candidate.requiredInputs.isEmpty() ? 'None' : #strings.listJoin(candidate.requiredInputs, ', ')}">CLASSIFICATION</dd></dl>
  <form method="post" th:action="@{/profiles/{profileId}/accounting/documents/candidates/{key}(profileId=${profileId},key=${candidate.candidateKey})}">
    <div class="row g-3"><div class="col-md-6"><label class="form-label">Counterparty</label><div class="d-flex gap-2"><select class="form-select" name="counterpartyId" id="candidate-counterparty" required><option value="">Choose counterparty</option><option th:each="item : ${counterparties}" th:value="${item.id}" th:selected="${item.id == candidate.counterpartyId}" th:text="${item.displayName}">Supplier</option></select><button class="btn btn-outline-secondary text-nowrap" data-testid="autofill-previous-month" id="autofill-previous-month" type="button" disabled>Autofill previous month</button></div><small class="text-secondary" th:text="${'Copies saved decision from ' + previousMonth + ' for this counterparty.'}">Copies saved decision from previous month.</small></div><div class="col-md-6"><label class="form-label">Classification</label><input class="form-control" name="classification" required th:value="${candidate.classification}"></div><div class="col-md-6"><label class="form-label">VAT treatment</label><input class="form-control" name="vatTreatment" required th:value="${candidate.vatTreatment}"></div><div class="col-md-3"><label class="form-label">VAT deduction ratio</label><input class="form-control" name="vatDeductionRatio" th:value="${candidate.vatTreatment == 'VAT_EXEMPT' ? '0' : ''}"></div><div class="col-md-3"><label class="form-label">Ryczalt rate</label><input class="form-control" name="ryczaltRate" th:value="${candidate.ryczaltRate}" th:required="${candidate.direction == 'INCOME'}"></div><div class="col-md-6"><label class="form-label">Payment verification</label><select class="form-select" name="paymentVerificationPolicy"><option value="REQUIRED" th:selected="${candidate.paymentVerificationPolicy == 'REQUIRED'}">Payment required</option><option value="NOT_REQUIRED" th:selected="${candidate.paymentVerificationPolicy == 'NOT_REQUIRED'}">Auto-paid / no verification</option></select></div><div class="col-md-6"><label class="form-label">Service key</label><input class="form-control" name="serviceKey"></div><div class="col-md-6 form-check ms-2"><input class="form-check-input" type="checkbox" name="rememberRule" value="true" id="rememberRule"><label class="form-check-label" for="rememberRule">Remember for this counterparty</label></div><div class="col-12"><label class="form-label">Rule name</label><input class="form-control" name="ruleName" th:value="${candidate.reference}"></div></div>
    <div class="mt-4 d-flex gap-2"><button class="btn btn-primary" name="approve" value="true" type="submit">Approve invoice</button><button class="btn btn-outline-secondary" name="approve" value="false" type="submit">Save for review</button></div>
  </form></div>
</div></main><script th:inline="javascript">
  const previousInvoices = /*[[${previousInvoices}]]*/ [];
  const counterparty = document.getElementById('candidate-counterparty');
  const autofill = document.getElementById('autofill-previous-month');
  const form = counterparty.form;
  const candidateDirection = /*[[${candidate.direction}]]*/ '';
  const matchingInvoice = () => previousInvoices.find(invoice => invoice.counterpartyId === Number(counterparty.value) && invoice.direction === candidateDirection);
  const refreshAutofill = () => { autofill.disabled = !matchingInvoice(); };
  counterparty.addEventListener('change', refreshAutofill);
  autofill.addEventListener('click', () => {
    const invoice = matchingInvoice();
    if (!invoice) return;
    form.elements.classification.value = invoice.classification || '';
    form.elements.vatTreatment.value = invoice.vatTreatment || '';
    form.elements.vatDeductionRatio.value = invoice.vatDeductionRatio || '';
    form.elements.ryczaltRate.value = invoice.ryczaltRate || '';
    form.elements.paymentVerificationPolicy.value = invoice.paymentVerificationPolicy || 'REQUIRED';
  });
  refreshAutofill();
</script>
</body></html>
