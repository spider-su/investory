<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counterparties · Accounting</title>
  <link href="/css/tabler.min.css" rel="stylesheet"><link href="/css/accounting.css" rel="stylesheet">
  <th:block th:replace="~{fragments/theme-head :: theme}"></th:block>
</head>
<body>
<main class="iv-app iv-report-page accounting-page" data-testid="accounting-counterparties-page">
  <div class="accounting-shell">
    <header class="accounting-compact-header">
      <h1>Counterparties</h1>
      <a class="accounting-document-back" th:href="@{/profiles/{profileId}/accounting(profileId=${profileId})}">‹ Back to accounting</a>
    </header>
    <section class="iv-planning-section iv-card card accounting-section" aria-label="Counterparties">
      <div class="accounting-empty iv-planning-section__empty" th:if="${counterparties.isEmpty()}">No known counterparties yet.</div>
      <div class="table-responsive" th:unless="${counterparties.isEmpty()}">
        <table class="table card-table table-vcenter">
          <thead>
          <tr><th>Name</th><th>Country / tax ID</th><th>Documents</th><th>Action</th></tr>
          </thead>
          <tbody>
          <tr th:each="item : ${counterparties}">
            <td>
              <a th:href="@{/profiles/{profileId}/accounting/counterparties/{id}(profileId=${profileId},id=${item.id})}" th:aria-label="${'Open counterparty ' + item.displayName}" th:text="${item.displayName}">Emagine</a>
              <span class="text-secondary d-block" th:if="${item.alias != null and !item.alias.isBlank()}" th:text="${item.legalName}">Legal name</span>
            </td>
            <td th:text="${item.country + ' · ' + item.taxIdentifier}">PL · 123</td>
            <td th:text="${item.invoiceCount}">0</td>
            <td><a class="btn btn-sm btn-outline-secondary" th:href="@{/profiles/{profileId}/accounting/counterparties/{id}(profileId=${profileId},id=${item.id})}">Edit</a></td>
          </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</main>
</body>
</html>
