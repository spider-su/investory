<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accounting document · Investory</title>
  <link href="/css/tabler.min.css" rel="stylesheet"><link href="/css/accounting.css" rel="stylesheet">
  <th:block th:replace="~{fragments/theme-head :: theme}"></th:block>
</head>
<body>
<main class="iv-app iv-planning-page accounting-document-page">
  <div class="container-xl py-4">
    <a class="accounting-document-back" th:href="@{/profiles/{profileId}/accounting(profileId=${profileId},month=${selectedMonth})}">‹ Back to accounting</a>
    <h1>Accounting document</h1>
    <p class="text-secondary">Review the recorded details for this document.</p>
    <section class="iv-card accounting-document-detail" data-testid="accounting-document-detail">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Document type</label><input class="form-control" readonly th:value="${document.direction + ' document'}" value="Income document"></div>
        <div class="col-md-6"><label class="form-label">Status</label><input class="form-control" readonly th:value="${document.status}" value="Issued"></div>
        <div class="col-md-6"><label class="form-label">Invoice</label><input class="form-control" readonly th:value="${document.reference}" value="INV-020"></div>
        <div class="col-md-6"><label class="form-label">Date</label><input class="form-control" readonly th:value="${document.date}" value="30 Jun"></div>
        <div class="col-md-6"><label class="form-label">Amount</label><input class="form-control" readonly th:value="${document.amount}" value="7 636 EUR"></div>
        <div class="col-md-6"><label class="form-label">Counterparty</label><input class="form-control" readonly th:value="${document.counterparty}" value="Counterparty"></div>
        <div class="col-md-6" th:if="${document.counterpartyTaxIdentifier != null}"><label class="form-label">Tax ID</label><input class="form-control" readonly th:value="${document.counterpartyTaxIdentifier}" value="Tax ID"></div>
        <div class="col-md-6" th:if="${document.counterpartyCountry != null}"><label class="form-label">Country</label><input class="form-control" readonly th:value="${document.counterpartyCountry}" value="PL"></div>
        <div class="col-md-6" th:if="${document.category != '—'}"><label class="form-label">Category</label><input class="form-control" readonly th:value="${document.category}" value="Services"></div>
        <div class="col-md-6" th:if="${document.saleDate != '—'}"><label class="form-label">Sale date</label><input class="form-control" readonly th:value="${document.saleDate}" value="30 Jun"></div>
        <div class="col-md-6" th:if="${document.acquisitionSource != null}"><label class="form-label">Acquisition source</label><input class="form-control" readonly th:value="${document.acquisitionSource}" value="KSeF"></div>
        <div class="col-md-6" th:if="${document.sourceName != null}"><label class="form-label">Source file</label><input class="form-control" readonly th:value="${document.sourceName}" value="invoice.xml"></div>
        <div class="col-md-6" th:if="${document.sourceReference != null}"><label class="form-label">Source reference</label><input class="form-control" readonly th:value="${document.sourceReferenceDisplay}" value="Source"></div>
      </div>
      <div class="accounting-document-detail__actions">
        <div th:if="${canWrite and document.direction != 'SALES' and document.paymentStatus != 'MATCHED' and document.paymentStatus != 'PARTIALLY_MATCHED'}" class="accounting-document-payment-actions" data-testid="accounting-document-payment-actions">
          <form th:if="${document.paymentStatus != 'MANUALLY_CONFIRMED'}" method="post" th:action="@{/profiles/{profileId}/accounting/documents/{documentId}/manual-paid(profileId=${profileId},documentId=${document.id})}" class="d-flex align-items-end gap-2">
            <input type="hidden" name="month" th:value="${selectedMonth}">
            <div><label class="form-label" for="paidDate">Payment date</label><input class="form-control" id="paidDate" name="paidDate" type="date" required th:value="${today}"></div>
            <div><label class="form-label" for="paidNote">Note</label><input class="form-control" id="paidNote" name="note" type="text" maxlength="1000" placeholder="Optional"></div>
            <button class="btn btn-success" type="submit" data-testid="accounting-document-confirm-paid">Confirm paid</button>
          </form>
          <form th:if="${document.paymentStatus == 'MANUALLY_CONFIRMED'}" method="post" th:action="@{/profiles/{profileId}/accounting/documents/{documentId}/manual-unpaid(profileId=${profileId},documentId=${document.id})}">
            <input type="hidden" name="month" th:value="${selectedMonth}">
            <button class="btn btn-outline-warning" type="submit" data-testid="accounting-document-make-unpaid">Make unpaid</button>
          </form>
        </div>
        <a class="btn btn-primary" data-testid="accounting-document-review" th:if="${canWrite and document.canReview}" th:href="@{/profiles/{profileId}/accounting/documents/review(profileId=${profileId},month=${selectedMonth},sourceReference=${document.sourceReference})}">Review document</a>
        <a class="btn btn-link" th:href="@{/profiles/{profileId}/accounting(profileId=${profileId},month=${selectedMonth})}">Back</a>
      </div>
    </section>
  </div>
</main>
</body>
</html>
