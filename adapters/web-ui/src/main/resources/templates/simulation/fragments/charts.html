<!-- Simulation financial outlook charts. -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="charts">
  <section class="card iv-simulation-section iv-simulation-charts" aria-labelledby="financial-outlook-title">
    <div class="iv-card-section-header"><span id="financial-outlook-title" class="iv-card-section-header__title">Financial outlook</span></div>
     <div class="card-body"><div class="iv-simulation-chart-switcher" data-simulation-chart-mode role="tablist" aria-label="Financial outlook chart"><button type="button" class="btn btn-sm btn-outline-secondary" data-chart-mode="CASH_FLOW" role="tab" aria-selected="false" aria-controls="cash-flow-chart-panel">Spending &amp; income</button><button type="button" class="btn btn-sm btn-outline-secondary is-active" data-chart-mode="LIQUID_CAPITAL" role="tab" aria-selected="true" aria-controls="liquid-capital-chart-panel">Liquid capital</button></div><div class="iv-simulation-chart-layout"><article id="cash-flow-chart-panel" class="iv-simulation-chart-panel" data-chart-panel="CASH_FLOW" aria-labelledby="simulation-chart-title" hidden><h3 id="simulation-chart-title">Spending &amp; income</h3><p id="simulation-chart-help" class="iv-simulation-chart-help">Annual spending, available income and resulting surplus or deficit.</p><div class="iv-simulation-chart-frame"><canvas id="simulation-chart" role="img" aria-label="Spending, income, and gap or surplus by year"></canvas></div></article><article id="liquid-capital-chart-panel" class="iv-simulation-chart-panel" data-chart-panel="LIQUID_CAPITAL" aria-labelledby="liquid-capital-chart-title"><h3 id="liquid-capital-chart-title">Liquid capital outlook</h3><p class="iv-simulation-chart-help">Expected end-of-year bonds and equities.</p><div class="iv-simulation-chart-frame"><canvas id="liquid-capital-chart" role="img" aria-label="Expected end-of-year bonds and equities by year"></canvas></div></article></div><p class="iv-simulation-chart-fallback text-secondary">Detailed values remain available in the Yearly projection and Planning bucket projection tables below.</p></div>
  </section>

</th:block>
