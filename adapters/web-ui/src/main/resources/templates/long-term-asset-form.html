<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/theme-head :: theme}"></th:block><meta charset="UTF-8"><title>Long-term asset · Investory</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="/css/tabler.min.css" rel="stylesheet"><link href="/css/main.css" rel="stylesheet"></head><body><main class="container-xl py-4"><h1>Long-term asset</h1><form class="card" method="post" th:action="@{/long-term-assets}"><div class="card-body"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required></div><div class="col-md-3"><label class="form-label">Type</label><select class="form-select" name="type"><option th:each="type : ${T(com.smartbox.investory.longterm.api.model.LongTermAssetTypeModel).values()}" th:value="${type}" th:text="${type}"></option></select></div><div class="col-md-3"><label class="form-label">Currency</label><select class="form-select" name="currency"><option th:each="currency : ${T(com.smartbox.investory.shared.currency.CurrencyType).values()}" th:value="${currency}" th:text="${currency}"></option></select></div><div class="col-md-4"><label class="form-label">Current value</label><input class="form-control" name="currentValue" type="number" step="0.01" min="0" required></div><div class="col-md-4"><label class="form-label">Acquisition date</label><input class="form-control" name="acquisitionDate" type="date"></div><div class="col-md-4"><label class="form-label">Acquisition value</label><input class="form-control" name="acquisitionValue" type="number" step="0.01" min="0"></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3"></textarea></div></div></div><div class="card-footer"><button class="btn btn-primary">Save</button> <a class="btn btn-link" th:href="@{/long-term-assets(portfolioId=${portfolioId})}">Cancel</a></div></form></main></body></html>
