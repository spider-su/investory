<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/theme-head :: theme}"></th:block>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${asset.name + ' · Investory'}">Bond · Investory</title>
  <link href="/css/tabler.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/asset-detail.css" rel="stylesheet">
</head>
<body>
<main class="container-xl py-4">
  <header class="iv-asset-page__header">
    <div>
      <div class="iv-asset-page__eyebrow">Bond</div>
      <h1 class="h2 mb-0" th:text="${asset.name}">Bond</h1>
      <p class="iv-asset-page__description">Manual planning bond. Saving replaces its current rate assumption.</p>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/long-term-assets(portfolioId=${portfolioId})}">Back</a>
  </header>

  <div class="alert alert-danger" th:if="${error}" th:text="${error}">Validation error.</div>

  <form class="card mb-4" method="post" th:action="@{/long-term-assets/{id}/bond(id=${asset.id})}">
    <div class="card-header"><h2 class="card-title">Bond details</h2></div>
    <div class="card-body">
      <input type="hidden" name="portfolioId" th:value="${portfolioId}">
      <div class="row g-3">
        <div class="col-lg-6"><label class="form-label" for="bond-name">Name</label><input id="bond-name" class="form-control" name="name" th:value="${asset.name}" required></div>
        <div class="col-sm-6 col-lg-3"><label class="form-label" for="bond-currency">Currency</label><input type="hidden" name="currency" th:value="${asset.currency}"><input id="bond-currency" class="form-control" th:value="${asset.currency}" readonly aria-readonly="true"></div>
        <div class="col-sm-6 col-lg-3"><label class="form-label" for="bond-value">Current value</label><input id="bond-value" class="form-control" name="value" type="number" step="0.01" min="0" th:value="${T(com.smartbox.investory.ui.presentation.UiPresentation).moneyInput(summary.bondPlanning.value)}" required></div>
        <div class="col-sm-6 col-lg-3"><label class="form-label" for="bond-purchase-date">Purchase date</label><input id="bond-purchase-date" class="form-control" name="acquisitionDate" type="date" th:value="${asset.acquisitionDate}" required></div>
        <div class="col-sm-6 col-lg-3"><label class="form-label" for="bond-maturity-date">Maturity date</label><input id="bond-maturity-date" class="form-control" name="maturityDate" type="date" th:value="${summary.bondPlanning.maturityDate}" required></div>
        <div class="col-sm-6 col-lg-3"><label class="form-label" for="bond-interest-mode">Interest mode</label><select id="bond-interest-mode" class="form-select" name="interestTreatment"><option value="CAPITALIZE" th:selected="${summary.bondPlanning.interestTreatment != null and summary.bondPlanning.interestTreatment.name() == 'CAPITALIZE'}">Accumulative</option><option value="PAY_OUT" th:selected="${summary.bondPlanning.interestTreatment != null and summary.bondPlanning.interestTreatment.name() == 'PAY_OUT'}">Distributed</option></select></div>
        <div class="col-sm-6 col-lg-3"><label class="form-label" for="bond-rate">Expected annual rate</label><div class="input-group"><input id="bond-rate" class="form-control" name="annualRatePercent" type="number" step="0.01" min="0" max="100" th:value="${T(com.smartbox.investory.ui.presentation.UiPresentation).percentageInput(summary.bondPlanning.annualRate)}" required><span class="input-group-text">%</span></div></div>
        <div class="col-12"><label class="form-label" for="bond-notes">Notes</label><textarea id="bond-notes" class="form-control" name="notes" rows="4" th:text="${asset.notes}"></textarea></div>
      </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary">Save changes</button></div>
  </form>

  <div class="iv-asset-page__actions">
    <form method="post" th:action="@{/long-term-assets/{id}/archive(id=${asset.id})}"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><button class="btn btn-outline-danger" th:if="${asset.active}">Archive</button></form>
    <form method="post" th:action="@{/long-term-assets/{id}/reactivate(id=${asset.id})}"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><button class="btn btn-outline-success" th:unless="${asset.active}">Reactivate</button></form>
  </div>
</main>
</body>
</html>
