<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/theme-head :: theme}"></th:block><meta charset="UTF-8"><title>Real estate · Investory</title><link href="/css/tabler.min.css" rel="stylesheet"><link href="/css/main.css" rel="stylesheet"></head>
<body><main class="container-xl py-4">
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h2" th:text="${asset.name}">Real estate</h1><a class="btn btn-outline-secondary" th:href="@{/long-term-assets(portfolioId=${portfolioId})}">Back</a></div>
<form class="card mb-4" method="post" th:action="@{/long-term-assets/{id}(id=${asset.id})}"><div class="card-body"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><input type="hidden" name="type" value="REAL_ESTATE"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" th:value="${asset.name}" required></div><div class="col-md-3"><label class="form-label">Currency</label><select class="form-select" name="currency"><option th:each="currency : ${T(com.smartbox.investory.shared.currency.CurrencyType).values()}" th:value="${currency}" th:text="${currency}" th:selected="${currency == asset.currency}"></option></select></div><div class="col-md-3"><label class="form-label">Current value</label><input class="form-control" name="currentValue" type="number" step="0.01" min="0" th:value="${T(com.smartbox.investory.ui.presentation.UiPresentation).moneyInput(asset.currentValue)}" required></div><div class="col-md-3"><label class="form-label">Purchase date</label><input class="form-control" name="acquisitionDate" type="date" th:value="${asset.acquisitionDate}"></div><div class="col-md-3"><label class="form-label">Annual tax base</label><input class="form-control" name="taxBase" type="number" min="0" step="1" th:value="${T(com.smartbox.investory.ui.presentation.UiPresentation).wholeNumberInput(asset.taxBase)}"></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="2" th:text="${asset.notes}"></textarea></div></div></div><div class="card-footer"><button class="btn btn-primary">Save property</button></div></form>
<section class="card mb-4"><div class="card-header"><h2 class="card-title">Rental contracts</h2></div><div class="card-body" th:if="${#lists.isEmpty(contracts)}">No rental contracts configured.</div><div class="table-responsive" th:unless="${#lists.isEmpty(contracts)}"><table class="table card-table"><thead><tr><th>From</th><th>Expected to</th><th>Terminated</th><th>Terms</th><th></th></tr></thead><tbody><tr th:each="contract : ${contracts}"><td th:text="${contract.startDate}">2026-04-01</td><td th:text="${contract.endDate ?: 'open'}">open</td><td th:text="${contract.terminatedDate ?: '-'}">-</td><td><span th:each="term : ${contract.terms}" class="me-3" th:text="${T(com.smartbox.investory.ui.presentation.UiPresentation).cashFlowType(term.type) + ': ' + term.amount + ' ' + term.frequency + (term.paidByTenant ? ' tenant' : '')}">Rent: 3700 MONTHLY</span></td><td><form method="post" th:action="@{/long-term-assets/{id}/rental-contracts/{contractId}/end(id=${asset.id},contractId=${contract.id})}" class="d-flex gap-1"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><input class="form-control form-control-sm" name="endDate" type="date" required><button class="btn btn-sm btn-outline-primary">End</button></form></td></tr></tbody></table></div>
<form class="card-body border-top" method="post" th:action="@{/long-term-assets/{id}/rental-contracts(id=${asset.id})}"><h3 class="h4">Add next contract</h3><input type="hidden" name="portfolioId" th:value="${portfolioId}"><div class="row g-2"><div class="col-md-2"><label class="form-label">Start</label><input class="form-control" name="startDate" type="date" required></div><div class="col-md-2"><label class="form-label">Expected end</label><input class="form-control" name="endDate" type="date"></div><div class="col-md-2"><label class="form-label">Rent / month</label><input class="form-control" name="rent" type="number" min="0" step="0.01"></div><div class="col-md-2"><label class="form-label">Parking / month</label><input class="form-control" name="parkingRent" type="number" min="0" step="0.01"></div><div class="col-md-2"><label class="form-label">Admin / month</label><input class="form-control" name="administrationFee" type="number" min="0" step="0.01"></div><div class="col-md-2"><label class="form-label">Utilities / month</label><input class="form-control" name="utilities" type="number" min="0" step="0.01"></div><div class="col-md-2"><label class="form-label">Other income</label><input class="form-control" name="otherIncome" type="number" min="0" step="0.01"></div><div class="col-md-2"><label class="form-label">Other cost</label><input class="form-control" name="otherExpense" type="number" min="0" step="0.01"></div><div class="col-md-3 form-check mt-3"><input class="form-check-input" name="rentalTaxPaidByTenant" value="true" type="checkbox"><label class="form-check-label">Tax paid by tenant</label></div><div class="col-md-2 mt-3"><button class="btn btn-primary">Add contract</button></div></div></form></section>
<form class="card mb-4" method="post" th:action="@{/long-term-assets/{id}/rental-tax-ownership(id=${asset.id})}"><div class="card-body"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><label class="form-check"><input class="form-check-input" type="checkbox" name="paidByTenant" value="true" th:checked="${asset.rentalTaxPaidByTenant}"><span class="form-check-label">Default rental tax paid by tenant</span></label></div><div class="card-footer"><button class="btn btn-outline-primary">Save tax ownership</button></div></form>
<div class="row row-cards mb-4"><div class="col-md-4"><div class="card"><div class="card-body"><div class="text-secondary">Monthly income</div><strong th:text="${T(com.smartbox.investory.ui.presentation.UiPresentation).money(summary.realEstatePlanning.netMonthlyIncome, asset.currency)}">0.00 PLN</strong></div></div></div><div class="col-md-4"><div class="card"><div class="card-body"><div class="text-secondary">Income yield</div><strong th:text="${T(com.smartbox.investory.ui.presentation.UiPresentation).percentage(summary.realEstatePlanning.incomeYield)}">0.0%</strong></div></div></div></div>
<details class="card mb-4"><summary class="card-header">Advanced planning</summary><div class="card-body"><form class="row g-2" method="post" th:action="@{/long-term-assets/{id}/property-growth(id=${asset.id})}"><input type="hidden" name="portfolioId" th:value="${portfolioId}"><div class="col-md-4"><input class="form-control" name="growthRatePercent" type="number" step="0.01" min="-100" max="100" placeholder="Expected annual growth" th:value="${expectedPropertyGrowth == null ? '' : T(com.smartbox.investory.ui.presentation.UiPresentation).percentageInput(expectedPropertyGrowth)}"></div><div class="col-md-3"><input class="form-control" name="effectiveFrom" type="date" th:value="${T(java.time.LocalDate).now()}" required></div><div class="col-md-3"><button class="btn btn-outline-primary">Save growth assumption</button></div></form></div></details>
</main></body></html>
